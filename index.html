    case "files":body='<div class="ik2-card">'+(t.files.length?'<div class="ik2-rows">'+t.files.map(f=>'<div class="ik2-row">'+ic("file",18)+'<div class="ik2-who"><div><b>'+esc(f.name)+'</b><small>'+esc(f.size+" · "+f.who)+'</small></div></div></div>').join("")+'</div>':'<p class="ik2-empty">Ek yok</p>')+'<label class="ik2-btn" style="margin-top:10px">'+ic("upload",14)+'Dosya ekle<input type="file" data-wfile hidden multiple></label></div>';break;
    case "time":body='<div class="ik2-preview" style="margin-bottom:12px"><div><small>Tahmini</small><b>'+hm(t.est)+'</b></div><div><small>Harcanan</small><b>'+hm(t.spent)+'</b></div><div><small>Kalan</small><b>'+hm(Math.max(0,t.est-t.spent))+'</b></div><div><small>Durum</small><b>%'+Math.round(t.spent/Math.max(1,t.est)*100)+'</b></div></div><div class="ik2-card"><div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><h3 style="margin:0">Zaman kayıtları</h3><span class="ik2-spacer"></span><button class="w2-timer '+(S.timer?.id===t.id?"run":"")+'" data-w="timer" data-v="'+t.id+'">'+ic("clock",12)+(S.timer?.id===t.id?"Süre ölçeri durdur":"Süre ölçeri başlat")+'</button></div><div class="ik2-rows">'+(t.timeLog.map(l=>'<div class="ik2-row">'+av(l.who,"sm")+'<span>'+esc(l.note)+'</span><div class="end"><b>'+hm(l.min)+'</b><small style="color:#6B7489">'+dlong(l.date)+'</small></div></div>').join("")||'<p class="ik2-empty">Kayıt yok</p>')+'</div><form class="w2-addrow" data-wform="time"><input name="min" type="number" min="5" step="5" placeholder="Dakika" required style="max-width:110px"><input name="note" placeholder="Ne yapıldı?"><button class="ik2-btn">Ekle</button></form></div>';break;
    case "rel":body='<div class="ik2-card">'+(t.rel.length?t.rel.map(r=>{const o=W(r.id);return o?'<div class="w2-rel">'+chip(r.kind,r.kind==="Engelleyen"?"#D23F4A":"#4F46E5")+'<button class="ik2-link" data-w="open" data-v="'+o.id+'">'+esc(o.code+" "+o.title)+'</button><div class="end" style="margin-left:auto">'+chip(stOf(o.status).name,stOf(o.status).color)+'</div></div>':"";}).join(""):'<p class="ik2-empty">İlişkili iş yok</p>')+'<form class="w2-addrow" data-wform="rel"><select name="kind" style="height:38px;border:1px solid #D9DEE8;border-radius:10px;padding:0 8px"><option>İlgili</option><option>Engelleyen</option><option>Engellenen</option><option>Kopyası</option></select><select name="id" style="flex:1;height:38px;border:1px solid #D9DEE8;border-radius:10px;padding:0 8px">'+S.tasks.filter(x=>x.id!==t.id).map(x=>'<option value="'+x.id+'">'+esc(x.code+" "+x.title)+'</option>').join("")+'</select><button class="ik2-btn">Bağla</button></form></div>';break;
    case "history":body='<div class="ik2-card"><div class="ik2-vsteps">'+t.history.slice().reverse().map(h=>'<div class="ik2-vstep done"><span>'+ic("clock",12)+'</span><div><b>'+esc(h.what)+'</b><small>'+esc(h.who)+' · '+ago(h.at)+'</small></div></div>').join("")+'</div></div>';break;
    default:body='<div class="ik2-card"><h3>Durum</h3><div class="w2-status-steps">'+STATUSES.map(x=>'<button data-w="setstatus" data-v="'+x.id+'" class="'+(t.status===x.id?"on":"")+'" style="--t:'+x.color+'">'+x.name+'</button>').join("")+'</div></div>'+
      '<div class="ik2-card"><h3>Açıklama</h3><p style="margin:0;font-size:13.5px;line-height:1.6;color:#2B3550">'+esc(t.desc)+'</p></div>'+
      '<div class="ik2-card"><h3>İş bilgileri</h3>'+facts([["Proje",chip(p.name,p.color)],["İş türü",esc(tyOf(t.type).name)],["Öncelik",prFlag(t)],["Sorumlu",'<span class="ik2-who">'+av(t.owner,"sm")+esc(t.owner)+'</span>'],["İşi açan",esc(t.opener)],["Takip edenler",esc(t.watchers.join(", "))],["Başlangıç",dlong(t.start)],["Teslim",dueChip(t)+" "+dlong(t.due)],["Bitiş",t.done?dlong(t.done):""],["Müşteri",esc(t.customer)],["Kaynak",esc(t.source)],["SLA hedefi",prOf(t.prio).sla+" iş günü"],["Etiketler",labelsHtml(t),true]])+'</div>';
  }
  return '<div class="ik2-shade" data-w="close"></div><aside class="ik2-drawer" role="dialog" aria-modal="true" aria-label="'+esc(t.title)+'">'+
    '<div class="ik2-hero"><span class="ik2-av lg" style="background:'+s.color+'">'+ic(tyOf(t.type).icon,26)+'</span><div style="min-width:0"><p style="margin:0 0 3px">'+esc(t.code)+' · '+esc(p.name)+'</p><h2>'+esc(t.title)+'</h2><div class="chips" style="margin-top:8px">'+chip(s.name,s.color)+prFlag(t)+dueChip(t)+'</div></div><button class="ik2-x" data-w="close" aria-label="Kapat">'+ic("close",18)+'</button></div>'+
    '<nav class="ik2-tabs">'+tabs.map(([k,l])=>'<button data-w="dtab" data-v="'+k+'" class="'+(tab===k?"on":"")+'">'+l+'</button>').join("")+'</nav>'+
    '<div class="ik2-dbody">'+body+'</div><footer class="ik2-dfoot"><small>Oluşturuldu '+ago(t.created)+' · '+esc(t.opener)+'</small><button class="ik2-btn bad" data-w="delete" data-v="'+t.id+'">'+ic("close",14)+'Sil</button><button class="ik2-btn" data-w="edit" data-v="'+t.id+'">'+ic("edit",14)+'Düzenle</button>'+(isOpen(t)?'<button class="ik2-btn ok" data-w="complete" data-v="'+t.id+'">'+ic("check",14)+'Tamamla</button>':"")+'</footer></aside>';
}

/* ═════════ Form ═════════ */
function form(id,tpl){
  const t=W(id)||{project:V.fProject||"PR1",type:"task",prio:"normal",owner:ME,start:T,due:shift(T,3),labels:[],est:240,title:tpl!==undefined?TEMPLATES[tpl][0]:"",desc:""};
  const F=(label,ctl,req,full)=>'<div class="ik2-f'+(full?" full":"")+'"><label>'+esc(label)+(req?' <i>*</i>':"")+'</label>'+ctl+'</div>';
  const sel=(n,opts,v)=>'<select name="'+n+'">'+opts.map(([a,b])=>'<option value="'+esc(a)+'" '+(String(a)===String(v)?"selected":"")+'>'+esc(b)+'</option>').join("")+'</select>';
  const body='<form class="ik2-form" data-wform="task" data-id="'+esc(id||"")+'" data-tpl="'+(tpl??"")+'"><div class="ik2-dbody"><div class="ik2-form">'+
    '<div class="ik2-fgroup"><h3>İş bilgileri</h3><div class="ik2-fields">'+F("Başlık",'<input name="title" required value="'+esc(t.title)+'" placeholder="Kısa ve net bir başlık">',true,true)+F("Proje",sel("project",PROJECTS.map(p=>[p.id,p.name]),t.project),true)+F("İş türü",sel("type",TYPES.map(x=>[x.id,x.name]),t.type),true)+F("Açıklama",'<textarea name="desc" placeholder="Kapsam, beklenti ve kabul kriteri">'+esc(t.desc)+'</textarea>',false,true)+'</div></div>'+
    '<div class="ik2-fgroup"><h3>Atama ve öncelik</h3><div class="ik2-fields">'+F("Sorumlu",sel("owner",MEMBERS.map(m=>[m,m]),t.owner),true)+F("Öncelik",sel("prio",PRIOS.map(p=>[p.id,p.name+" · SLA "+p.sla+" gün"]),t.prio),true)+F("Etiketler",'<div style="display:flex;gap:6px;flex-wrap:wrap">'+LABELS.map(l=>'<label class="w2-label" style="--t:'+l[1]+';height:28px;padding:0 10px;cursor:pointer;gap:5px"><input type="checkbox" name="labels" value="'+esc(l[0])+'" '+(t.labels.includes(l[0])?"checked":"")+'>'+esc(l[0])+'</label>').join("")+'</div>',false,true)+'</div></div>'+
    '<div class="ik2-fgroup"><h3>Planlama</h3><div class="ik2-fields">'+F("Başlangıç",'<input type="date" name="start" value="'+t.start+'" required>',true)+F("Teslim",'<input type="date" name="due" value="'+t.due+'" required>',true)+F("Tahmini süre (saat)",'<input type="number" name="est" min="0.5" step="0.5" value="'+(t.est/60)+'">')+F("Tekrar",sel("repeat",[["","Tekrarlanmaz"],["w","Her hafta"],["m","Her ay"]],""))+'</div></div>'+
    '</div></div><footer class="ik2-dfoot"><small>* Zorunlu alan'+(tpl!==undefined&&!id?" · Şablondaki "+TEMPLATES[tpl][1].length+" alt iş eklenecek":"")+'</small><button type="button" class="ik2-btn" data-w="close" style="background:#64748B;border-color:#64748B">Vazgeç</button><button class="ik2-btn primary">'+ic("check",15)+'Kaydet</button></footer></form>';
  return '<div class="ik2-shade" data-w="close"></div><section class="ik2-dialog" role="dialog" aria-modal="true"><div class="ik2-dhead"><div><h2>'+(id?"İşi düzenle":"Yeni iş")+'</h2><p>'+(id?esc(t.code):"Proje, sorumlu, öncelik ve teslim tarihini belirle")+'</p></div><button type="button" class="ik2-x" data-w="close" aria-label="Kapat">'+ic("close",18)+'</button></div>'+body+'</section>';
}

/* ═════════ İşlemler ═════════ */
function layerEl(){let l=document.getElementById("is2-layer");if(!l){l=document.createElement("div");l.id="is2-layer";document.body.appendChild(l);}return l;}
function openLayer(html,state){const l=layerEl();l.className="open ik2";l.style.cssText="position:fixed;inset:0;z-index:80;padding:0;max-width:none;margin:0";l.innerHTML=html;V.layer=state;setTimeout(()=>l.querySelector("input:not([type=checkbox]),textarea,.ik2-x")?.focus(),30);}
function closeLayer(){const l=document.getElementById("is2-layer");if(l){l.className="";l.style.cssText="display:none";l.innerHTML="";}V.layer=null;}
function openTask(id){V.dtab=V.layer?.id===id?V.dtab:"detail";openLayer(drawer(id),{type:"task",id});}
function refresh(){if(route!=="is2")return;const y=window.scrollY;screen.innerHTML=page();window.scrollTo(0,y);if(V.layer?.type==="task"){const l=layerEl();const b=l.querySelector(".ik2-dbody"),st=b?b.scrollTop:0;l.innerHTML=drawer(V.layer.id);const nb=l.querySelector(".ik2-dbody");if(nb)nb.scrollTop=st;}}
function setStatus(t,s){if(!t||t.status===s)return;const prev=t.status;t.status=s;t.done=s==="done"?T:"";if(s==="done")t.subs.forEach(x=>x.done=true);logA(t,"Durumu “"+stOf(prev).name+"” → “"+stOf(s).name+"” yaptı");}
function stopTimer(){if(!S.timer)return;const t=W(S.timer.id),min=Math.max(1,Math.round((Date.now()-S.timer.at)/6e4));if(t){t.spent+=min;t.timeLog.push({who:ME,min,date:T,note:"Süre ölçer"});logA(t,hm(min)+" süre kaydetti");}S.timer=null;return min;}
function page(){readSec();const map={overview:secOverview,board:secBoard,list:secList,mine:secMine,calendar:secCalendar,timeline:secTimeline,load:secLoad,projects:secProjects,reports:secReports,defs:secDefs};return '<div class="ik2 is2">'+head()+nav()+'<div class="ik2-body">'+map[V.sec]()+'</div></div>';}

document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-w]");if(!el||!el.closest(".is2,#is2-layer"))return;
  const a=el.dataset.w,v=el.dataset.v||"";
  if(["sel","selall","complete","timer","quick"].includes(a)||el.closest(".w2-ev,.bar")&&a==="open")ev.stopPropagation();
  if(a!=="open"&&el.closest("[data-w='open']")!==el&&["complete","timer","sel","selall"].includes(a))ev.stopPropagation();
  switch(a){
    case "go":V.lateOnly=!!el.dataset.late;location.hash="#is2?s="+v;if(V.sec===v)refresh();break;
    case "open":openTask(v);break;
    case "close":closeLayer();break;
    case "dtab":V.dtab=v;refresh();break;
    case "new":openLayer(form(""),{type:"form"});break;
    case "tpl":openLayer(form("",Number(v)),{type:"form"});break;
    case "edit":openLayer(form(v),{type:"form"});break;
    case "delete":{const t=W(v);if(!window.confirm(t.code+" silinsin mi?"))return;S.tasks=S.tasks.filter(x=>x.id!==v);save(t.code+" silindi.");closeLayer();refresh();break;}
    case "setstatus":setStatus(W(V.layer.id),v);save("Durum güncellendi.");refresh();break;
    case "complete":{ev.preventDefault();setStatus(W(v),"done");save(W(v).code+" tamamlandı.");refresh();break;}
    case "timer":{ev.preventDefault();if(S.timer?.id===v){const m=stopTimer();save(hm(m)+" kaydedildi.");}else{if(S.timer)stopTimer();S.timer={id:v,at:Date.now()};save("Süre ölçer başladı.");}refresh();break;}
    case "quick":V.quick=v;refresh();setTimeout(()=>document.querySelector('.w2-quick input')?.focus(),20);break;
    case "qc":{const ta=el.closest("form").text;ta.value=v;ta.focus();break;}
    case "clear":V.q=V.fProject=V.fOwner=V.fPrio=V.fLabel="";refresh();break;
    case "sort":V.sortDir=V.sortKey===v?-V.sortDir:1;V.sortKey=v;refresh();break;
    case "sel":{if(el.checked)V.sel.add(v);else V.sel.delete(v);refresh();break;}
    case "selall":{const ids=filtered().map(t=>t.id);if(el.checked)ids.forEach(i=>V.sel.add(i));else V.sel.clear();refresh();break;}
    case "unsel":V.sel.clear();refresh();break;
    case "alllist":V.lateOnly=false;refresh();break;
    case "month":{if(v==="0")V.month=T.slice(0,7);else{const [y,m]=V.month.split("-").map(Number);const d=new Date(y,m-1+Number(v),1);V.month=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}refresh();break;}
    case "day":V.q="";V.sec="list";location.hash="#is2?s=list";break;
    case "gshift":V.gStart=v==="0"?shift(T,-14):shift(V.gStart,Number(v));refresh();break;
    case "proj":V.fProject=v;break;
    case "reset":try{localStorage.removeItem(KEY);}catch{}S=seedData();save("Örnek veriler sıfırlandı.");refresh();break;
  }
});
document.addEventListener("input",ev=>{if(ev.target.matches?.("[data-wq]")){V.q=ev.target.value;const pos=ev.target.selectionStart;refresh();const n=document.querySelector("[data-wq]");if(n){n.focus();n.setSelectionRange(pos,pos);}}});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.dataset?.wf){V[el.dataset.wf]=el.value;refresh();}
  if(el.dataset?.wbulk&&el.value){const k=el.dataset.wbulk;for(const id of V.sel){const t=W(id);if(!t)continue;if(k==="status")setStatus(t,el.value);else{t[k]=el.value;logA(t,(k==="owner"?"Sorumluyu "+el.value:"Önceliği "+prOf(el.value).name)+" yaptı");}}save(V.sel.size+" iş güncellendi.");V.sel.clear();refresh();}
  if(el.dataset?.wsub!==undefined){const t=W(V.layer.id),x=t.subs[Number(el.dataset.wsub)];x.done=el.checked;logA(t,"Alt işi "+(x.done?"tamamladı":"yeniden açtı")+": "+x.t);if(t.subs.every(s=>s.done)&&["doing","plan","todo"].includes(t.status)){setStatus(t,"review");save("Tüm alt işler bitti; iş incelemeye alındı.");}else save();refresh();}
  if(el.matches?.("[data-wfile]")){const t=W(V.layer.id);for(const f of el.files)t.files.push({name:f.name,size:Math.max(1,Math.round(f.size/1024))+" KB",who:ME});logA(t,el.files.length+" dosya ekledi");save("Dosya eklendi.");refresh();}
});
document.addEventListener("submit",ev=>{
  const f=ev.target;if(!f.dataset?.wform)return;ev.preventDefault();
  const v=Object.fromEntries(new FormData(f)),k=f.dataset.wform;
  if(k==="quick"){const n=S.tasks.length;const t={id:"W"+Date.now(),code:"İŞ-"+(1001+n+Math.floor(Math.random()*90)),title:v.title,project:V.fProject||"PR1",type:"task",labels:[],status:f.dataset.status,prio:"normal",owner:ME,opener:ME,watchers:[],start:T,due:shift(T,3),created:new Date().toISOString(),done:"",est:120,spent:0,timeLog:[],desc:"",subs:[],comments:[],files:[],rel:[],customer:"",source:"Sistem",history:[]};logA(t,"İşi oluşturdu");S.tasks.unshift(t);V.quick="";save(t.code+" eklendi.");refresh();return;}
  if(k==="task"){
    const id=f.dataset.id,labels=new FormData(f).getAll("labels");
    if(v.due<v.start){showSnackbar("Teslim tarihi başlangıçtan önce olamaz.");return;}
    if(id){const t=W(id);Object.assign(t,{title:v.title,project:v.project,type:v.type,desc:v.desc,owner:v.owner,prio:v.prio,start:v.start,due:v.due,est:Number(v.est||0)*60,labels});logA(t,"İşi düzenledi");save("İş güncellendi.");closeLayer();refresh();openTask(id);return;}
    const tpl=f.dataset.tpl===""?null:TEMPLATES[Number(f.dataset.tpl)];
    const t={id:"W"+Date.now(),code:"İŞ-"+(1100+S.tasks.length),title:v.title,project:v.project,type:v.type,labels,status:"todo",prio:v.prio,owner:v.owner,opener:ME,watchers:[],start:v.start,due:v.due,created:new Date().toISOString(),done:"",est:Number(v.est||0)*60,spent:0,timeLog:[],desc:v.desc,subs:tpl?tpl[1].map(x=>({t:x,done:false})):[],comments:[],files:[],rel:[],customer:"",source:"Sistem",history:[]};
    logA(t,"İşi oluşturdu ve "+v.owner+" kişisine atadı"+(v.repeat?" (yinelenen)":""));S.tasks.unshift(t);save(t.code+" oluşturuldu.");closeLayer();refresh();openTask(t.id);return;
  }
  const t=W(V.layer?.id);if(!t)return;
  if(k==="sub"){t.subs.push({t:v.t,done:false});logA(t,"Alt iş ekledi: "+v.t);save();}
  if(k==="comment"){t.comments.push({who:ME,text:v.text,at:new Date().toISOString()});logA(t,"Yorum yazdı");save("Yorum eklendi.");}
  if(k==="time"){const m=Number(v.min);t.spent+=m;t.timeLog.push({who:ME,min:m,date:T,note:v.note||"Elle giriş"});logA(t,hm(m)+" süre kaydetti");save("Süre kaydedildi.");}
  if(k==="rel"){t.rel.push({kind:v.kind,id:v.id});logA(t,v.kind+" iş bağladı: "+(W(v.id)?.code||""));save("İlişki eklendi.");}
  refresh();
});
/* Sürükle-bırak (pano) */
let dragId=null;
document.addEventListener("dragstart",ev=>{const c=ev.target.closest?.("[data-drag2]");if(!c)return;dragId=c.dataset.drag2;c.classList.add("dragging");ev.dataTransfer.effectAllowed="move";ev.dataTransfer.setData("text/plain",dragId);});
document.addEventListener("dragover",ev=>{if(!dragId)return;const col=ev.target.closest?.("[data-drop2]");document.querySelectorAll(".over").forEach(x=>x!==col&&x.classList.remove("over"));if(col){ev.preventDefault();col.classList.add("over");}});
document.addEventListener("drop",ev=>{const col=ev.target.closest?.("[data-drop2]");if(!col||!dragId)return;ev.preventDefault();const t=W(dragId),s=stOf(col.dataset.drop2);
  if(s.wip&&S.tasks.filter(x=>x.status===s.id).length>=s.wip&&t.status!==s.id)showSnackbar("“"+s.name+"” sütunu sınırda ("+s.wip+"); yine de taşındı.");
  setStatus(t,s.id);save();dragId=null;refresh();});
document.addEventListener("dragend",()=>{dragId=null;document.querySelectorAll(".over,.dragging").forEach(x=>x.classList.remove("over","dragging"));});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&V.layer){ev.stopPropagation();closeLayer();}if(ev.key==="Escape"&&V.quick){V.quick="";refresh();}},true);

/* ═════════ Uygulamaya bağlama ═════════ */
routes.add("is2");routeNames.is2="İş Takibi 2.0";
const ws=groups.find(g=>g[0]==="Çalışma Alanı");if(ws&&!ws[1].some(x=>x[0]==="is2"))ws[1].splice(2,0,["is2","İş Takibi 2.0","board"]);
const prevRender=render;
render=function(){
  if(route==="is2"){renderNav();renderTop();closeLayer();screen.innerHTML=page();renderPopup();document.title=SECS.find(x=>x[0]===V.sec)[1]+" · İş Takibi 2.0 · TALES ERP";return;}
  closeLayer();prevRender();
};
window.is2Debug={state:()=>S,V};
window.is2Api={addTask:t=>{t.code="İŞ-"+(2000+S.tasks.length);S.tasks.unshift(t);save();return true;}};
if(location.hash.startsWith("#is2"))readRoute();else renderNav();
})();
</script>

.o2-quote{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid #E6E9F0;border-radius:12px;background:#fff;margin-bottom:8px}

<script>

(()=>{

 {id:"P4",name:"Kurulum ve proje yönetimi",unit:"adam/gün",price:9000,cat:"Hizmet"},{id:"P5",name:"Kullanıcı eğitimi",unit:"gün",price:6500,cat:"Hizmet"},{id:"P6",name:"Entegrasyon paketi",unit:"adet",price:45000,cat:"Hizmet"},
 {id:"P7",name:"Bakım ve destek",unit:"yıl",price:38000,cat:"Destek"},{id:"P8",name:"El terminali (donanım)",unit:"adet",price:18000,cat:"Donanım"},{id:"P9",name:"Bulut barındırma",unit:"yıl",price:12000,cat:"Altyapı"},{id:"P10",name:"Raporlama paketi",unit:"adet",price:22000,cat:"Lisans"}];

const ACCOUNTS=[["Kuzey Teknoloji","Teknoloji","Ankara","250+"],["Eksen Lojistik","Lojistik","İstanbul","500+"],["Pera Yazılım","Teknoloji","İstanbul","50–250"],["Mavi Endüstri","Sanayi","Bursa","500+"],["Sentez Danışmanlık","Hizmet","Ankara","10–50"],["Atlas Hizmetler","Hizmet","İzmir","250+"],["Anadolu Gıda","Gıda","Konya","500+"],["Delta Enerji","Enerji","Ankara","250+"],["Toros Belediyesi","Kamu","Mersin","1000+"],["Ege Tekstil","Tekstil","Denizli","250+"],["Orion Sağlık","Sağlık","İstanbul","500+"],["Vira Denizcilik","Lojistik","İzmir","50–250"]].map(([name,sector,city,size],i)=>({id:"A"+(i+1),name,sector,city,size,phone:"0"+(212+i*3)+" "+(400+i*7)+" "+String(10+i).padStart(2,"0")+" "+String(40+i).padStart(2,"0"),web:name.toLocaleLowerCase("tr").split(" ")[0].replace(/[çğıöşü]/g,c=>({ç:"c",ğ:"g",ı:"i",ö:"o",ş:"s",ü:"u"})[c])+".example",
  contacts:[["Ahmet","Yılmaz","Genel Müdür",0],["Zeynep","Kara","Finans Direktörü",1],["Murat","Çelik","BT Müdürü",2],["Ayşe","Demir","Operasyon Uzmanı",3],["Can","Öztürk","Satın Alma Uzmanı",4]].slice(0,3+(i%3)).map(([f,l,t,r],k)=>({id:"K"+i+k,name:[f,"Elif","Mehmet","Gül","Onur"][(i+k)%5]+" "+[l,"Aksoy","Polat","Erdem","Kurt"][(i*2+k)%5],title:t,role:r,phone:"05"+(32+k)+" "+(300+i*4)+" "+String(10+k).padStart(2,"0")+" "+String(20+i).padStart(2,"0"),email:"kisi"+k+"@"+name.toLocaleLowerCase("tr").split(" ")[0].replace(/[çğıöşü]/g,c=>({ç:"c",ğ:"g",ı:"i",ö:"o",ş:"s",ü:"u"})[c])+".example",sentiment:["Destekçi","Nötr","Şüpheci"][(i+k)%3]}))}));

/* ═════════ Örnek veri ═════════ */
function seedData(){
  const names=[["ERP lisans genişletme","A1"],["Saha servis mobil uygulaması","A2"],["Bakım sözleşmesi yenileme","A3"],["PDKS entegrasyonu","A4"],["Depo otomasyonu","A4"],["İK modülü geçişi","A6"],["Raporlama paketi","A5"],["Kalite yönetimi","A7"],["Bayi portalı","A8"],["Destek paketi yenileme","A1"],["Belediye ERP dönüşümü","A9"],["Üretim planlama","A10"],["Hasta randevu entegrasyonu","A11"],["Filo takip mobil","A12"],["Bulut geçişi","A2"],["Satın alma onay akışı","A7"],["Muhasebe modülü","A8"],["El terminali yenileme","A4"],["Yönetici panosu","A6"],["Personel portalı","A11"],["Enerji tüketim raporu","A8"],["E-fatura entegrasyonu","A10"],["Kampanya yönetimi","A3"],["Çağrı merkezi entegrasyonu","A2"],["Mobil onay uygulaması","A1"],["Saha denetim formu","A9"],["Stok sayım otomasyonu","A12"],["Eğitim paketi","A5"]];
  const stages=["quote","nego","won","qual","new","quote","lost","needs","nego","won","qual","needs","quote","new","nego","lost","qual","won","needs","quote","new","nego","won","needs","qual","quote","lost","new"];
  return {v:3,opps:names.map(([name,a],i)=>{
    const stage=stages[i],ac=acc(a),owner=REPS[i%REPS.length].name;

    const disc=[0,5,10,8,0,12,0,5,20,0,7,0,18,0,10,0,5,0,0,15,0,10,5,0,0,8,0,0][i];
    const created=D(-90+i*3),stageIdx=STAGES.findIndex(s=>s.id===stage),checks={};
    STAGES.forEach((s,k)=>{checks[s.id]=s.crit.map((_,c)=>k<stageIdx||(k===stageIdx&&(c+i)%3!==0)||stage==="won");});
    const close=stage==="won"||stage==="lost"?D(-(i%20)-2):D(5+(i*9)%80);
    const acts=[{id:"AC"+i+"a",type:"call",date:shift(created,2),done:true,who:owner,note:"İlk görüşme yapıldı, ihtiyaçlar konuşuldu.",contact:ac.contacts[0].name},{id:"AC"+i+"b",type:"meet",date:shift(created,10),done:true,who:owner,note:"Keşif toplantısı: mevcut sistem ve süreçler incelendi.",contact:ac.contacts[1].name}].concat(stageIdx>=2&&stage!=="lost"?[{id:"AC"+i+"c",type:"demo",date:shift(created,18),done:true,who:owner,note:"Canlı demo; mobil ve raporlama ilgi çekti.",contact:ac.contacts[2]?.name||ac.contacts[0].name}]:[]).concat(isOpenO({stage})?[{id:"AC"+i+"d",type:["call","meet","mail","task"][i%4],date:D([-3,1,2,0,4,-1,6][i%7]),done:false,who:owner,note:["Teklif geri bildirimi al","Fiyat görüşmesi","Revize teklif gönder","Karar toplantısı"][i%4],contact:ac.contacts[0].name}]:[]);
    const quotes=stageIdx>=3&&stage!=="lost"||stage==="lost"&&i%2===0?[{id:"Q"+i+"1",no:"TKF-26-"+String(200+i*2),ver:1,date:shift(created,25),valid:shift(created,55),lines:lines.map(l=>({...l})),disc:Math.max(0,disc-5),status:stage==="lost"?"Reddedildi":"Gönderildi",note:""}].concat(i%3===0&&stageIdx>=4?[{id:"Q"+i+"2",no:"TKF-26-"+String(201+i*2),ver:2,date:shift(created,40),valid:shift(created,70),lines:lines.map(l=>({...l})),disc,status:stage==="won"?"Kabul edildi":disc>DISC_LIMIT?"Onay bekliyor":"Gönderildi",note:"Revize: hacim indirimi"}]:[]):[];
    if(stage==="won"&&quotes.length)quotes[quotes.length-1].status="Kabul edildi";
    const lastAct=OPEN_IDS.includes(stage)?D(-[2,5,1,9,3,16,4,7,2,12,6,3,18,1,5][i%15]):(acts.filter(x=>x.done).map(x=>x.date).sort().pop()||created);
    return {id:"O"+(100+i),code:"FRS-26-"+String(101+i),name,account:a,contact:ac.contacts[0].id,owner,stage,stageAt:OPEN_IDS.includes(stage)?D(-(4+(i*7)%28)):shift(created,10+(i%5)*6),created,close,lines,disc,source:SOURCES[i%7],type:["Yeni satış","Ek satış","Yenileme"][i%3],

}
function nav(){

/* ─── Kazanç / kayıp ─── */
function secAnalysis(){
  const won=S.opps.filter(o=>o.stage==="won"),lost=S.opps.filter(o=>o.stage==="lost"),closed=[...won,...lost];
  const reasons=LOSS.map(r=>[r,lost.filter(o=>o.lossReason===r)]).filter(x=>x[1].length),maxR=Math.max(...reasons.map(x=>x[1].length),1);
  const comp=COMPETITORS.map(c=>{const met=S.opps.filter(o=>o.competitors.includes(c)||o.lossComp===c);const w=met.filter(o=>o.stage==="won").length,l=met.filter(o=>o.stage==="lost"&&o.lossComp===c).length;return [c,met.length,w,l];}).filter(x=>x[1]);
  const bySource=SOURCES.map(s=>{const os=S.opps.filter(o=>o.source===s),w=os.filter(o=>o.stage==="won").length,c=os.filter(o=>["won","lost"].includes(o.stage)).length;return [s,os.length,c?Math.round(w/c*100):null];});
  const stageTime=OPEN_IDS.map(id=>{const os=S.opps.filter(o=>o.stage===id);return [stg(id),os.length?Math.round(os.reduce((n,o)=>n+daysIn(o),0)/os.length):0];}),maxT=Math.max(...stageTime.map(x=>x[1]),1);
  return '<div class="ik2-kpis">'+kpi("Kazanılan",won.length,TLs(won.reduce((n,o)=>n+amountOf(o),0)),"#12936A")+kpi("Kaybedilen",lost.length,TLs(lost.reduce((n,o)=>n+amountOf(o),0)),"#D23F4A")+kpi("Kazanma oranı","%"+(closed.length?Math.round(won.length/closed.length*100):0),"Kapanan fırsatlarda","#4F46E5")+kpi("Ort. indirim (kazanılan)","%"+(won.length?(won.reduce((n,o)=>n+(o.disc||0),0)/won.length).toFixed(1):0),"Teklif indirimi","#D97706")+'</div>'+
  '<div class="ik2-cols"><section class="ik2-panel c6"><header><h2>Kayıp nedenleri</h2></header><div class="ik2-bars">'+(reasons.map(([r,l])=>'<div class="ik2-bar" style="grid-template-columns:170px 1fr 30px"><span>'+esc(r)+'</span><div class="ik2-meter" style="--t:#D23F4A"><i style="width:'+(l.length/maxR*100)+'%"></i></div><b>'+l.length+'</b></div>').join("")||'<p class="ik2-empty">Kayıp yok</p>')+'</div></section>'+
  '<section class="ik2-panel c6"><header><h2>Rakip analizi</h2><small>Karşılaşılan fırsatlar</small></header><div class="ik2-tablewrap" style="border:0"><table class="ik2-table"><thead><tr><th>Rakip</th><th class="num">Karşılaşma</th><th class="num">Kazandık</th><th class="num">Kaybettik</th></tr></thead><tbody>'+comp.map(([c,n,w,l])=>'<tr><td><b>'+esc(c)+'</b></td><td class="num">'+n+'</td><td class="num" style="color:#12936A">'+w+'</td><td class="num" style="color:#D23F4A">'+l+'</td></tr>').join("")+'</tbody></table></div></section>'+
  '<section class="ik2-panel c6"><header><h2>Kaynağa göre dönüşüm</h2></header><div class="ik2-bars">'+bySource.map(([s,n,r])=>'<div class="ik2-bar" style="grid-template-columns:130px 1fr 70px"><span>'+esc(s)+'</span><div class="ik2-meter" style="--t:#4F46E5"><i style="width:'+(r||0)+'%"></i></div><b>'+(r===null?n+" açık":"%"+r)+'</b></div>').join("")+'</div></section>'+
  '<section class="ik2-panel c6"><header><h2>Aşamada ortalama bekleme</h2><small>Gün</small></header><div class="ik2-bars">'+stageTime.map(([s,d])=>'<div class="ik2-bar"><span>'+s.name+'</span><div class="ik2-meter" style="--t:'+s.color+'"><i style="width:'+(d/maxT*100)+'%"></i></div><b>'+d+'</b></div>').join("")+'</div></section>'+
  '<section class="ik2-panel c12"><header><h2>Kaybedilen fırsatlar</h2></header><div class="ik2-rows">'+lost.map(o=>'<div class="ik2-row" data-o="open" data-v="'+o.id+'" style="cursor:pointer"><div class="ik2-who" style="flex:1"><div><b>'+esc(o.name)+' · '+esc(acc(o.account).name)+'</b><small>'+esc(o.lossNote)+'</small></div></div><div class="end">'+chip(o.lossReason,"#D23F4A")+(o.lossComp?chip(o.lossComp,"#64748B"):"")+'<b>'+TLs(amountOf(o))+'</b></div></div>').join("")+'</div></section></div>';
}

function drawer(id){
  const o=O(id);if(!o)return "";const s=stg(o.stage),a=acc(o.account),tab=V.dtab,ct=contactOf(o);
  const tabs=[["summary","Özet"],["process","Satış süreci"],["lines","Ürünler"],["quotes","Teklifler ("+o.quotes.length+")"],["acts","Aktiviteler ("+o.acts.length+")"],["people","Karar kişileri"],["comp","Rakipler"],["history","Geçmiş"]];

function setStage(o,id,quiet){
  if(!o||o.stage===id)return;const target=stg(id),idx=STAGES.findIndex(s=>s.id===id),cur=STAGES.findIndex(s=>s.id===o.stage);

  const missing=idx>cur&&cur>=0&&o.stage!=="lost"?STAGES.slice(cur,idx).filter(s=>s.crit.length&&critDone(o,s.id)<s.crit.length).map(s=>s.name):[];

<script>
"use strict";
(()=>{
const ME=team[0];
const MT={other:"",fileFilter:"all",menu:""};
const tone=name=>personTone(name);
const mAv=name=>{const t=tone(name);return '<span class="mt-av" style="background:color-mix(in srgb,'+t+' 14%,#fff);color:'+t+'">'+e(initials(name))+'</span>';};
const fmtFull=(d,tm)=>{const x=asDate(d);return String(x.getDate()).padStart(2,"0")+"."+String(x.getMonth()+1).padStart(2,"0")+"."+x.getFullYear()+" · "+(tm||"10:00");};
const rel=(d,tm)=>{const t=new Date(d+"T"+(tm||"10:00")+":00"),m=Math.max(1,Math.round((Date.now()-t)/6e4));return m<60?m+" dk önce":m<1440?Math.round(m/60)+" saat önce":m<43200?Math.round(m/1440)+" gün önce":Math.round(m/43200)+" ay önce";};
const ftype=n=>{const x=String(n).split(".").pop().toLowerCase();return ["pdf"].includes(x)?["pdf","PDF","file","#D23F4A"]:["jpg","jpeg","png","webp","heic","gif"].includes(x)?["img","Görsel","image","#7C3AED"]:["doc","docx","txt","rtf"].includes(x)?["doc","Belge","note","#3158C9"]:["xls","xlsx","csv"].includes(x)?["xls","Tablo","chart","#1B9C6B"]:["other","Diğer","file","#64748B"];};
const rerender=()=>{if(popup)renderPopup();else{const d=$("#inspector");if(d)d.innerHTML=inspectorContent();}};
const hhmm=i=>String(9+(i*3)%8).padStart(2,"0")+":"+String((i*17)%60).padStart(2,"0");

/* ─── Yorumlar ─── */
function comments(row){
  const list=row.comments||[];
  const card=(c,i)=>{const me=c.author===ME,tm=c.time||hhmm(i),isFile=!!c.file;
    const body=isFile?(()=>{const t=ftype(c.file);return '<div class="mt-filecomment"><span class="mt-ftype" style="--t:'+t[3]+'">'+svg(t[2],17)+'</span><div><b>'+e(c.file)+'</b><small>'+t[1]+(c.size?" · "+e(c.size):"")+'</small></div></div>';})():'<p>'+e(c.text).replace(/@([A-ZÇĞİÖŞÜ][a-zçğıöşü]+ [A-ZÇĞİÖŞÜ][a-zçğıöşü]+)/g,'<mark>@$1</mark>')+'</p>';
    return '<div class="mt-row'+(me?" me":"")+'">'+mAv(c.author)+'<div class="mt-card'+(me?" me":"")+'"><div class="h"><b>'+e(c.author)+'</b>'+(me?'<span class="mt-you">Siz</span>':"")+'<small>'+rel(c.date,tm)+'</small><button class="mt-more" data-mt="cmenu" data-v="'+i+'" aria-label="İşlemler">'+svg("more",18)+'</button></div>'+body+'<hr><div class="f">'+svg("calendar",13)+fmtFull(c.date,tm)+(c.cust?'<span class="mt-cust-pill">'+svg("review",12)+'Müşteri görür</span>':"")+'</div>'+
      (MT.menu===String(i)?'<div class="mt-menu"><button data-mt="ccopy" data-v="'+i+'">'+svg("file",15)+'Kopyala</button><button data-mt="creply" data-v="'+i+'">'+svg("chat",15)+'Yanıtla</button>'+(me?'<button class="red" data-mt="cdel" data-v="'+i+'">'+svg("close",15)+'Sil</button>':"")+'</div>':"")+'</div></div>';};
  return '<form class="mt-compose" data-form="mt-comment" data-task="'+e(row.id)+'"><textarea name="text" maxlength="2000" placeholder="Yorum yaz… (@ ile kişi etiketle)" aria-label="Yorum"></textarea><footer><label class="mt-cust"><input type="checkbox" name="cust"> Müşteri görsün</label><label class="mt-attach">'+svg("upload",15)+'Dosya ekle<input type="file" data-mt-file="'+e(row.id)+'" hidden></label><button class="mt-send">'+svg("arrow",15)+'Gönder</button></footer></form>'+
    '<div class="mt-feed">'+(list.length?list.map((c,i)=>[c,i]).reverse().map(([c,i])=>card(c,i)).join(""):'<p class="mempty">'+svg("chat",26)+'Henüz yorum yok.</p>')+'</div>';
}

/* ─── Ekler (Belgeler) ─── */
function docsOf(row){
  const real=(row.attachments||[]).map(f=>({name:f.name,size:f.size?(Math.max(1,Math.ceil(f.size/1024))+" KB"):"",who:f.who||ME,date:f.date||day(),data:f.data}));
  return real.length?real:demoFiles(row,"tasks").map(x=>({name:x.n,size:x.size,who:x.who,date:x.date,data:""}));
}
function files(row){
  const all=docsOf(row),types=[["all","Tümü"],["img","Görsel"],["pdf","PDF"],["doc","Belge"],["xls","Tablo"]];
  const list=all.filter(f=>MT.fileFilter==="all"||ftype(f.name)[0]===MT.fileFilter);
  return '<div class="mt-subhead"><h3>Belgeler</h3><em>'+all.length+' dosya</em></div><div class="mt-chips">'+types.map(([k,l])=>'<button data-mt="ffilter" data-v="'+k+'" class="'+(MT.fileFilter===k?"on":"")+'">'+l+'<em>'+(k==="all"?all.length:all.filter(f=>ftype(f.name)[0]===k).length)+'</em></button>').join("")+'</div>'+
    '<div class="mt-docs"><label class="mt-doc add">'+svg("upload",24)+'Dosya ekle<small style="font-weight:500">Görsel, PDF, belge · en fazla 1 MB</small><input type="file" data-mt-file="'+e(row.id)+'" data-attach-only="1" hidden multiple></label>'+
    list.map(f=>{const t=ftype(f.name);return '<a class="mt-doc" style="--t:'+t[3]+'" '+(f.data?'href="'+e(f.data)+'" download="'+e(f.name)+'"':'href="#" data-mt="nofile"')+'><span class="thumb">'+svg(t[2],30)+'</span><b title="'+e(f.name)+'">'+e(f.name)+'</b><small>'+t[1]+(f.size?" · "+e(f.size):"")+'</small><small>'+e(f.who)+' · '+e(dateText(f.date))+'</small></a>';}).join("")+'</div>'+(list.length?"":'<p class="mempty">Bu türde dosya yok.</p>');
}

/* ─── Diğer ─── */
const statusTone=s=>({[stages[0]]:"#8E9AAD",[stages[1]]:"#4361EE",[stages[2]]:"#5B5BD6",[stages[3]]:"#1B9C6B"})[s]||"#64748B";
function relatedOf(row){return db.tasks.filter(t=>t.id!==row.id&&t.project===row.project).slice(0,4);}
function recordsOf(row){
  if(!row.workLog){const n=(Number(String(row.id).replace(/\D/g,""))||3)%5+2;row.workLog=Array.from({length:n},(_,i)=>({date:shift(row.start||day(),i),start:hhmm(i),min:[90,120,45,180,60,150][i%6],over:i===n-1&&n>4,who:i%3===2?team[(i+2)%team.length]:row.owner||ME,note:["Analiz ve hazırlık","Geliştirme","Test","Müşteri görüşmesi","Düzeltme","Dokümantasyon"][i%6]}));}
  return row.workLog;
}
function planOf(row){return row.planMin||((((Number(String(row.id).replace(/\D/g,""))||1)%4)+2)*240);}
function other(row,events){
  const checks=row.checklist||[],rel=relatedOf(row),recs=recordsOf(row),spent=recs.reduce((n,r)=>n+r.min,0),plan=planOf(row);
  const hm=m=>(m>=60?Math.floor(m/60)+" sa ":"")+(m%60?m%60+" dk":m>=60?"":"0 dk");

  if(MT.other==="sub"){const ow=i=>[row.owner||ME,...team.filter(t=>t!==row.owner)][i%3],st=c=>c.done?["Tamamlandı","#1B9C6B"]:["İşlemde","#4361EE"];
    return back+'<div class="mt-subhead"><h3>Alt işler</h3><em>'+checks.filter(c=>c.done).length+' / '+checks.length+' tamamlandı</em></div>'+checks.map((c,i)=>{const s=st(c),due=shift(row.start||day(),i+1);return '<label class="mt-rec'+(c.done?" done":"")+'" style="cursor:pointer"><span class="mt-rec-top"><span class="o">'+e(row.code)+'.'+(i+1)+'</span><span class="mt-status" style="--t:'+s[1]+'">'+s[0]+'</span></span><b><input type="checkbox" data-check-index="'+i+'" data-task="'+e(row.id)+'" '+(c.done?"checked":"")+' style="margin-right:8px">'+e(c.title)+'</b><span class="r">'+svg("flag",14)+'Aşama: '+s[0]+'</span><span class="r">'+svg("projects",14)+e(display("tasks",row,"project"))+'</span><span class="tail">'+avatar(ow(i))+'<small style="color:#8592A6;flex:1">'+e(ow(i))+'</small><small style="color:#8592A6">'+svg("calendar",12)+' '+e(dateText(due))+'</small></span></label>';}).join("")+'<form class="mt-addform" style="grid-template-columns:1fr auto" data-form="checklist" data-task="'+e(row.id)+'"><label class="grow">Yeni alt iş<input name="title" required maxlength="140" placeholder="Alt iş başlığı"></label><button>Ekle</button></form>';}
  if(MT.other==="time"){const d=plan-spent,over=d<0,ratio=Math.min(1.5,spent/Math.max(1,plan)),t=over?"#D23F4A":ratio>.8?"#D98B21":"#1B9C6B";
    return back+'<div class="mt-subhead"><h3>Süre</h3><span class="mt-status" style="--t:'+(over?"#D23F4A":"#1B9C6B")+'">'+(over?"Süre aşıldı":"Süre içinde")+'</span></div><div class="mt-strip"><div><small>Planlanan</small><b>'+hm(plan)+'</b></div><i></i><div><small>Harcanan</small><b>'+hm(spent)+'</b></div><i></i><div><small>'+(over?"Sapma":"Kalan")+'</small><b style="color:'+(over?"#D23F4A":"#14243C")+'">'+hm(Math.abs(d))+'</b></div></div><div class="mt-usage" style="--t:'+t+'"><div class="bar"><i style="width:'+Math.min(100,ratio*100)+'%"></i></div><b>%'+Math.round(spent/Math.max(1,plan)*100)+'</b></div>'+
      '<div class="mt-subhead"><h3>Kişi bazında</h3></div>'+[...new Set(recs.map(r=>r.who))].map(w=>{const m=recs.filter(r=>r.who===w).reduce((n,r)=>n+r.min,0);return '<div class="mt-rec" style="cursor:default"><span class="tail">'+avatar(w)+'<b style="flex:1">'+e(w)+'</b><b>'+hm(m)+'</b></span><div class="mt-usage" style="margin:0;--t:#3158C9"><div class="bar"><i style="width:'+(m/spent*100)+'%"></i></div><b>%'+Math.round(m/spent*100)+'</b></div></div>';}).join("");}
  if(MT.other==="activity")return back+'<div class="mt-subhead"><h3>Aktivite</h3><em>'+events.length+' kayıt</em></div>'+historyTimeline(events);

/* ─── Mevcut İş Takip detayına bağlama ─── */
const baseTaskRecord=taskRecord;
taskRecord=function(row,events,isInline,stepAction,module="tasks"){
  const html=baseTaskRecord(row,events,isInline,stepAction,module);
  if(module!=="tasks")return html;
  if(!events.length)events=demoEvents(row,module);
  const nComments=(row.comments||[]).length,nFiles=docsOf(row).length,act=isInline?"inline-tab":"tab";
  const tabs=[["info","Detay","grid",0],["comments","Yorumlar","chat",nComments],["files","Ekler","image",nFiles],["history","Geçmiş","clock",0],["other","Diğer","layers",0]];
  const nav='<nav class="mtabs" aria-label="İş bölümleri">'+tabs.map(([k,l,i,b])=>'<button type="button" class="mtab'+(recordTab===k?" on":"")+'" data-action="'+act+'" data-value="'+k+'" aria-pressed="'+(recordTab===k)+'"><span class="mtab-ico">'+svg(i,19)+(b?'<b>'+(b>99?"99+":b)+'</b>':"")+'</span><span>'+l+'</span></button>').join("")+'</nav>';
  let out=html;
  if(!["comments","files","other"].includes(recordTab))return out;
  const body=recordTab==="comments"?comments(row):recordTab==="files"?files(row):other(row,events);
  const s=out.indexOf('<div class="panel-body">')+'<div class="panel-body">'.length,eIdx=out.lastIndexOf('</div><footer class="panel-actions">');
  return s>23&&eIdx>s?out.slice(0,s)+body+out.slice(eIdx):out;
};
document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-mt]");if(!el)return;
  const a=el.dataset.mt,v=el.dataset.v||"",form=el.closest(".task-record");
  const row=rowOf("tasks",(popup&&popup.module==="tasks"?popup.id:inspector));
  switch(a){
    case "other":ev.preventDefault();MT.other=v;rerender();break;
    case "addrec":MT.addRec=!MT.addRec;rerender();break;
    case "ffilter":MT.fileFilter=v;rerender();break;
    case "cmenu":MT.menu=MT.menu===v?"":v;rerender();break;
    case "ccopy":{const c=row?.comments?.[Number(v)];if(c)navigator.clipboard?.writeText(c.text||c.file||"");MT.menu="";rerender();showSnackbar("Yorum kopyalandı.");break;}
    case "creply":{const c=row?.comments?.[Number(v)];MT.menu="";rerender();const ta=document.querySelector('form[data-form="mt-comment"] textarea');if(ta&&c){ta.value="@"+c.author+" ";ta.focus();}break;}
    case "cdel":{if(row){row.comments.splice(Number(v),1);MT.menu="";persist("Yorum silindi.");rerender();}break;}
    case "nofile":ev.preventDefault();showSnackbar("Örnek dosya; indirilecek içerik yok.");break;
  }
});
document.addEventListener("submit",ev=>{
  const f=ev.target;
  if(f.dataset?.form==="mt-comment"){ev.preventDefault();ev.stopImmediatePropagation();const r=rowOf("tasks",f.dataset.task),v=Object.fromEntries(new FormData(f));if(!r||!String(v.text||"").trim())return;const n=new Date();(r.comments??=[]).push({author:ME,date:day(),time:String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"),text:v.text.trim(),cust:!!v.cust});persist("Yorum eklendi.");rerender();}
  if(f.dataset?.form==="mt-record"){ev.preventDefault();ev.stopImmediatePropagation();const r=rowOf("tasks",f.dataset.task),v=Object.fromEntries(new FormData(f));recordsOf(r).push({date:v.date,start:v.start,min:Number(v.min),over:!!v.over,who:ME,note:v.note||"Çalışma"});MT.addRec=false;persist("İş kaydı eklendi.");rerender();}
},true);
document.addEventListener("change",async ev=>{
  const inp=ev.target;if(!inp.dataset?.mtFile)return;
  const r=rowOf("tasks",inp.dataset.mtFile),files=[...inp.files];if(!r||!files.length)return;
  if(files.reduce((n,f)=>n+f.size,0)>1048576){showSnackbar("En fazla 1 MB dosya ekleyebilirsin.");return;}
  const read=f=>new Promise((ok,no)=>{const rd=new FileReader();rd.onload=()=>ok(rd.result);rd.onerror=no;rd.readAsDataURL(f);});
  for(const f of files){const data=await read(f);(r.attachments??=[]).push({name:f.name,size:f.size,data,who:ME,date:day()});if(!inp.dataset.attachOnly){const n=new Date();(r.comments??=[]).push({author:ME,date:day(),time:String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"),file:f.name,size:Math.max(1,Math.ceil(f.size/1024))+" KB"});}}
  persist(files.length+" dosya eklendi.");rerender();
});
/* Sekme değişince alt ekran ve menü sıfırlansın */
document.addEventListener("click",ev=>{const t=ev.target.closest('[data-action="tab"],[data-action="inline-tab"],[data-action="open"]');if(t){MT.menu="";if(t.dataset.value!=="other")MT.other="";}},true);
})();

.nf-card{grid-template-columns:1fr!important}
.nf-check{display:grid;place-items:center;width:30px;height:30px;cursor:pointer;flex:none}
.nf-check input{width:17px!important;height:17px!important;margin:0;accent-color:#3158C9;cursor:pointer}
.nf-row.sel .nf-card{border-color:#3158C9!important;box-shadow:0 0 0 2px #3158C922}
.nf-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3158C9;margin-right:7px;vertical-align:1px}
.nf-head .nf-check{margin-left:-6px}
.nf-bulk{background:#EEF3FF;border-bottom:1px solid #D8E2F7}
.nf-bulk h2{font-size:14.5px!important;color:#3158C9!important}
.nf-bulk button{margin-left:0!important}.nf-bulk button:first-of-type{margin-left:auto!important}
.nf-bulk button.red{color:#D23F4A}.nf-bulk button.red:hover{background:#FDEDEE}
.nf-day{margin-left:34px!important}
.nf-pop{background:#F3F5F9!important}
.nf-pop::before{background:#F3F5F9!important}
.nf-pop .nf-tabs{background:#E6EAF1!important}
.nf-pop .nf-foot{background:#F3F5F9!important;border-top-color:#E3E8F0!important}
.nf-pop .nf-card{background:#fff;border-color:#E3E8F0}
.top-bell.nf-open{background:#EEF2FE!important;color:#3158C9!important}
</style>
<script>
"use strict";
(()=>{
const KEY="tales-notif-v1";
const TYPES={approval:["Onay bekliyor","check","#D98B21"],comment:["Yorum","chat","#3158C9"],mention:["Bahsedildin","user","#7C3AED"],assign:["Atama","work","#0EA5E9"],deadline:["Teslim tarihi","clock","#D23F4A"],leave:["İzin","calendar","#1B9C6B"],system:["Sistem","settings","#64748B"],sales:["Satış","target","#DB2777"]};
const now=Date.now(),H=36e5;
function seed(){
  const items=[
    ["approval","Satın alma onay süreci onayınızı bekliyor","Süreç: Satın alma onay süreci · Talep eden Elif Arslan","Süreçler","#workflows?view=inbox",.4],
    ["mention","Mert Yıldız sizi bir yorumda andı","“@Deniz Kaya test ortamında kontrol edebilir misin?” · İŞ-003","İş Takip","#tasks",1.2],
    ["deadline","2 işin teslim tarihi geçti","Kasım kapanış kontrolü ve Rapor şablonları gecikmede","İş Takip","#tasks?view=list&late=1",2.5],
    ["leave","Burak Demir yıllık izin talebi oluşturdu","25–29 Kas · 5 iş günü · yerine bakacak Selin Aydın","İzin Talepleri","#leave",3.4],
    ["comment","Ece Şahin İŞ-012'ye yorum yazdı","“Parça değişimi tamamlandı, test aşamasında.”","İş Takip","#tasks",5],
    ["assign","Size yeni bir iş atandı","İŞ-018 · Test ortamı sürüm notlarını yaz · Teslim 27 Kas","İş Takip","#tasks",7],
    ["sales","Teklif TKF-26-214 müşteri tarafından kabul edildi","Kuzey Teknoloji · ERP lisans genişletme · ₺184.200","Fırsatlarım","#opp2?s=quotes",20],
    ["approval","%18 indirimli teklif onay bekliyor","TKF-26-226 · Orion Sağlık · Hasta randevu entegrasyonu","Fırsatlarım","#opp2?s=quotes",26],
    ["comment","Selin Aydın İŞ-004'e dosya ekledi","Ekran_tasarimi.png · 880 KB","İş Takip","#tasks",30],
    ["leave","Mazeret izniniz onaylandı","19 Kas · 1 gün · Elif Arslan onayladı","İzin Talepleri","#leave",50],
    ["system","Haftalık bakım işi oluşturuldu","Her pazartesi 09:00 tekrarlanan iş otomatik açıldı","İş Takibi 2.0","#is2?s=list",56],
    ["assign","Burak Demir sizi İŞ-007'nin takipçisi yaptı","PDKS alan değişikliği formu","İş Takip","#tasks",76],
    ["system","Sistem bakımı tamamlandı","Pazar 02:00–03:00 arası planlı bakım sona erdi","Sistem","#home",98]
  ];
  return {v:1,items:items.map(([type,title,body,mod,href,hAgo],i)=>({id:"N"+(i+1),type,title,body,mod,href,at:new Date(now-hAgo*H).toISOString(),read:i>=6&&i!==7}))};
}
let S;try{S=JSON.parse(localStorage.getItem(KEY)||"null");}catch{S=null;}
if(!S||S.v!==1)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch{}};
const unread=()=>S.items.filter(n=>!n.read).length;
const N={open:false,tab:"unread",sel:new Set()};
const rel=iso=>{const m=Math.max(1,Math.round((Date.now()-new Date(iso))/6e4));return m<60?m+" dk önce":m<1440?Math.round(m/60)+" saat önce":Math.round(m/1440)+" gün önce";};
const hm=iso=>{const d=new Date(iso);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
const dayLabel=iso=>{const d=new Date(iso),t=new Date();const k=x=>x.toDateString();if(k(d)===k(t))return "Bugün";const y=new Date(t);y.setDate(t.getDate()-1);if(k(d)===k(y))return "Dün";return new Intl.DateTimeFormat("tr-TR",{day:"numeric",month:"long",weekday:"long"}).format(d);};

function panel(){
  const list=S.items.filter(n=>N.tab==="all"||(N.tab==="unread"?!n.read:n.read)).sort((a,b)=>b.at.localeCompare(a.at));
  const groups=[];for(const n of list){const g=dayLabel(n.at);let x=groups.find(y=>y[0]===g);if(!x){x=[g,[]];groups.push(x);}x[1].push(n);}
  const u=unread(),r=S.items.length-u;
  const row=(n,last)=>{const t=TYPES[n.type]||TYPES.system,sel=N.sel.has(n.id);return '<div class="nf-row'+(n.read?"":" unread")+(sel?" sel":"")+'"><label class="nf-check" title="Seç"><input type="checkbox" data-nf-sel="'+e(n.id)+'" '+(sel?"checked":"")+' aria-label="Bildirimi seç"></label><div class="nf-card" data-nf="go" data-v="'+e(n.id)+'" tabindex="0"><div><b>'+(n.read?"":'<i class="nf-dot"></i>')+e(n.title)+'</b><p>'+e(n.body)+'</p><div class="nf-meta"><span class="mod">'+e(n.mod)+'</span>'+e(t[0])+' · '+hm(n.at)+' · '+rel(n.at)+'</div></div>'+
    '<span class="nf-acts"><button data-nf="toggle" data-v="'+e(n.id)+'" title="'+(n.read?"Okunmadı olarak işaretle":"Okundu olarak işaretle")+'" aria-label="'+(n.read?"Okunmadı yap":"Okundu yap")+'">'+svg(n.read?"mail":"check",15)+'</button><button class="del" data-nf="del" data-v="'+e(n.id)+'" title="Sil" aria-label="Sil">'+svg("close",15)+'</button></span></div></div>';};
  const vis=list.map(n=>n.id),allSel=vis.length&&vis.every(id=>N.sel.has(id));
  return (N.sel.size?'<div class="nf-head nf-bulk"><label class="nf-check" title="Tümünü seç"><input type="checkbox" data-nf-all '+(allSel?"checked":"")+' aria-label="Görünenlerin tümünü seç"></label><h2>'+N.sel.size+' seçildi</h2><button data-nf="bread">'+svg("check",14)+'Okundu yap</button><button data-nf="bunread">'+svg("mail",14)+'Okunmadı yap</button><button data-nf="bdel" class="red">'+svg("close",14)+'Sil</button></div>':'<div class="nf-head"><label class="nf-check" title="Tümünü seç"><input type="checkbox" data-nf-all aria-label="Görünenlerin tümünü seç" '+(vis.length?"":"disabled")+'></label><h2>Bildirimler</h2>'+(u?'<span class="cnt">'+u+'</span>':"")+'<button data-nf="allread" '+(u?"":"disabled")+'>'+svg("check",14)+'Tümünü okundu say</button></div>')+
    '<div class="nf-tabs" role="tablist">'+[["unread","Okunmamış",u],["read","Okunmuş",r],["all","Tümü",S.items.length]].map(([k,l,c])=>'<button role="tab" aria-selected="'+(N.tab===k)+'" class="'+(N.tab===k?"on":"")+'" data-nf="tab" data-v="'+k+'">'+l+'<em>'+c+'</em></button>').join("")+'</div>'+
    '<div class="nf-list">'+(groups.length?groups.map(([g,items])=>'<div class="nf-day">'+e(g)+'</div>'+items.map((n,i)=>row(n,i===items.length-1)).join("")).join(""):'<div class="nf-empty"><span>'+svg(N.tab==="unread"?"check":"bell",24)+'</span><b style="color:#14243C">'+(N.tab==="unread"?"Okunmamış bildirim yok":"Bildirim yok")+'</b>'+(N.tab==="unread"?"Hepsini okudun. Eski bildirimler “Okunmuş” sekmesinde.":"")+'</div>')+'</div>'+
    '<div class="nf-foot"><button data-nf="clearread">'+svg("close",13)+'Okunmuşları temizle</button><a href="#workflows?view=inbox" data-nf="close">Onay kutusuna git '+svg("right",13)+'</a></div>';
}
function el(){let p=document.getElementById("nf-pop");if(!p){p=document.createElement("div");p.id="nf-pop";p.className="nf-pop";p.setAttribute("role","dialog");p.setAttribute("aria-label","Bildirimler");document.body.appendChild(p);}return p;}
function bell(){return [...document.querySelectorAll(".top-bell")].find(a=>/Bildirim/.test(a.getAttribute("title")||""));}
function place(){const p=document.getElementById("nf-pop"),b=bell();if(!p||!b)return;const r=b.getBoundingClientRect(),w=p.offsetWidth;let left=Math.min(window.innerWidth-w-10,r.right-w+18);left=Math.max(10,left);p.style.left=left+"px";p.style.top=(r.bottom+12)+"px";p.style.setProperty("--arrow",Math.max(16,Math.min(w-28,(r.left+r.width/2)-left-6))+"px");}
function draw(){if(!N.open)return;const p=el();p.innerHTML=panel();place();}
function open(){N.open=true;N.tab=unread()?"unread":"all";draw();bell()?.classList.add("nf-open");}
function close(){N.open=false;N.sel.clear();document.getElementById("nf-pop")?.remove();bell()?.classList.remove("nf-open");}
function badge(){const b=bell();if(!b)return;const u=unread();let dot=b.querySelector(".bell-dot");if(!u){dot?.remove();}else{if(!dot){dot=document.createElement("span");dot.className="bell-dot";b.appendChild(dot);}dot.textContent=u>99?"99+":u;}b.setAttribute("aria-label","Bildirimler"+(u?" ("+u+" okunmamış)":""));if(N.open)b.classList.add("nf-open");}

document.addEventListener("click",ev=>{
  const b=ev.target.closest(".top-bell");
  if(b&&/Bildirim/.test(b.getAttribute("title")||"")){ev.preventDefault();ev.stopPropagation();N.open?close():open();return;}
  const sb=ev.target.closest("[data-nf-sel],[data-nf-all],.nf-check");
  if(sb&&ev.target.closest("#nf-pop")){ev.stopPropagation();const inp=sb.matches("input")?sb:sb.querySelector("input");if(!inp||ev.target!==inp)return;
    if(inp.dataset.nfSel!==undefined){inp.checked?N.sel.add(inp.dataset.nfSel):N.sel.delete(inp.dataset.nfSel);}
    else{const ids=S.items.filter(n=>N.tab==="all"||(N.tab==="unread"?!n.read:n.read)).map(n=>n.id);if(inp.checked)ids.forEach(i=>N.sel.add(i));else N.sel.clear();}
    draw();return;}
  const t=ev.target.closest("[data-nf]");
  if(!t){if(N.open&&!ev.target.closest("#nf-pop"))close();return;}
  const a=t.dataset.nf,v=t.dataset.v,n=S.items.find(x=>x.id===v);
  if(a!=="close")ev.preventDefault();ev.stopPropagation();
  switch(a){
    case "tab":N.tab=v;N.sel.clear();draw();break;
    case "bread":S.items.forEach(x=>{if(N.sel.has(x.id))x.read=true;});N.sel.clear();save();draw();badge();break;
    case "bunread":S.items.forEach(x=>{if(N.sel.has(x.id))x.read=false;});N.sel.clear();save();draw();badge();break;
    case "bdel":{const c=N.sel.size;S.items=S.items.filter(x=>!N.sel.has(x.id));N.sel.clear();save();draw();badge();showSnackbar(c+" bildirim silindi.");break;}
    case "toggle":if(n){n.read=!n.read;save();draw();badge();}break;
    case "del":S.items=S.items.filter(x=>x.id!==v);save();draw();badge();break;
    case "allread":S.items.forEach(x=>x.read=true);save();N.tab="read";draw();badge();showSnackbar("Tüm bildirimler okundu olarak işaretlendi.");break;
    case "clearread":{const c=S.items.filter(x=>x.read).length;S.items=S.items.filter(x=>!x.read);save();draw();badge();showSnackbar(c?c+" okunmuş bildirim temizlendi.":"Temizlenecek okunmuş bildirim yok.");break;}
    case "go":if(n){n.read=true;save();close();badge();location.hash=n.href;}break;
    case "close":close();break;
  }
},true);
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&N.open){close();bell()?.focus();}if(ev.key==="Enter"&&ev.target.matches?.(".nf-card"))ev.target.click();});
window.addEventListener("resize",place);window.addEventListener("scroll",()=>N.open&&place(),true);
const baseTop=renderTop;renderTop=function(){baseTop();badge();};
badge();
})();
</script>

<style id="form-compact">
/* Detay pencereleri: gri gövde yok */
.record-panel .panel-body,.desk-record .panel-body,.task-record .panel-body{background:#F3F5F9!important}
#modal .task-record .detail-group,#modal .task-record .tl-card,#modal .task-record .mt-rec,#modal .task-record .mt-tile,#modal .task-record .mt-strip,#modal .task-record .mt-doc,#modal .task-record .mt-compose,#modal .task-record .mt-card:not(.me),#modal .task-record .editor-card,#modal .task-record .task-checks,#modal .task-record .mt-addform,#inspector .task-record .detail-group,#inspector .task-record .tl-card,#inspector .task-record .mt-rec,#inspector .task-record .mt-tile,#inspector .task-record .mt-strip,#inspector .task-record .mt-doc,#inspector .task-record .mt-compose,#inspector .task-record .mt-card:not(.me),#inspector .task-record .editor-card{background:#fff!important;border:1px solid #E6EAF0!important;box-shadow:0 2px 8px #0F1F3D0a!important}
#modal .task-record .search-input,#inspector .task-record .search-input{background:#fff!important}
.record-panel .tl-card,.record-panel .detail-group,.record-panel .editor-card,.record-panel .mt-rec,.record-panel .mt-card:not(.me){border:1px solid #E3E8F0!important}
#modal .tl-day,#inspector .tl-day,#screen .tl-day,#is2-layer .tl-day,#ik2-layer .tl-day,#op2-layer .tl-day{box-shadow:none!important;background:transparent!important;border:0!important;outline:0!important}
.tl-day>h3,.tl-day>h3 small{background:transparent!important;box-shadow:none!important}

/* Formlar: mavi ön ikon, kompakt alanlar */
.field .field-icon{background:#EEF3FF!important;color:#3158C9!important;opacity:1!important;width:30px!important;height:30px!important;min-width:30px!important;border-radius:9px!important}
.field .field-icon svg{color:#3158C9!important;opacity:1!important;width:16px!important;height:16px!important}
#modal .field,#inspector .field,.dialog .field,.desk-editor .field,.work-wizard .field,#inline-filter .field{min-height:0!important;padding-top:10px!important;padding-bottom:10px!important;column-gap:10px!important;row-gap:0!important}
.field label{font-size:11px!important;line-height:1.2!important;margin:0!important}
.field input:not([type=checkbox]):not([type=radio]):not([type=file]),.field select{height:24px!important;min-height:0!important;line-height:24px!important;padding-top:0!important;padding-bottom:0!important;font-size:13.5px!important}
.field textarea{min-height:44px!important;padding-top:2px!important}
.form-rows,.form-grid{gap:8px!important}
</style>
