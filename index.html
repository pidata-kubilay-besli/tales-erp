/* ══════════════════════════════════════════════════════════════════════
   Filtreye web dokunuşları: açılış animasyonu, geniş ekranda iki sütun,
   imleç ve odak geri bildirimi, klavye ipucu, yapışkan alt çubuk.
   ══════════════════════════════════════════════════════════════════════ */
/* 1 — Açılırken yumuşak giriş */
@keyframes filter-pop{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
#inline-filter .filter-editor{animation:filter-pop .16s cubic-bezier(.22,1,.36,1) both;transform-origin:top right}
@media(prefers-reduced-motion:reduce){#inline-filter .filter-editor{animation:none}}

/* 2 — Geniş ekranda panel genişler, koşullar iki sütuna yayılır */
@media(min-width:1180px){
  #inline-filter{width:min(620px,calc(100% - 16px))!important}
  #inline-filter .filter-editor .filter-rules{
    display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;
    gap:8px!important;align-items:start}
  #inline-filter .filter-editor .criteria-add{grid-column:1/-1}
}

/* 3 — Satırlar tıklanabilir hissettirsin */
#inline-filter .filter-editor .filter-rule{cursor:pointer;transition:border-color .14s,background-color .14s,box-shadow .14s}
#inline-filter .filter-editor .filter-rule:hover{box-shadow:0 2px 8px #16233510!important}
#inline-filter .filter-editor .filter-rule:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--m-primary) 13%,transparent)!important}
#inline-filter .filter-editor .filter-rule select,
#inline-filter .filter-editor .filter-rule input{cursor:pointer}
#inline-filter .filter-editor .filter-rule .btn.icon{transition:background-color .14s,color .14s,opacity .14s;opacity:.55}
#inline-filter .filter-editor .filter-rule:hover .btn.icon,
#inline-filter .filter-editor .filter-rule:focus-within .btn.icon{opacity:1}

/* 4 — Alt çubuk yapışkan, Uygula'da ⏎ ipucu */
#inline-filter .filter-editor{display:flex;flex-direction:column;max-height:min(78vh,760px)}
#inline-filter .filter-editor .panel-body{overflow:auto;flex:1;scrollbar-width:thin}
#inline-filter .filter-editor .panel-actions{position:sticky;bottom:0;flex:none;
  box-shadow:0 -6px 14px #1623350a}
#inline-filter .filter-editor .panel-actions .btn.primary::after{
  content:"⏎";margin-left:8px;font-size:12px;opacity:.65;font-weight:600}
#inline-filter .filter-editor .panel-actions .btn.ghost{order:-1}

/* 5 — Başlıkta kısayol ipucu ve sayaç çipi */
#inline-filter .filter-editor .panel-head{position:relative;display:flex;align-items:center;gap:10px}
#inline-filter .filter-editor .panel-head h2::after{
  content:"Esc ile kapat";display:block;margin-top:2px;
  font-size:11px;font-weight:600;color:#A3AEBE;letter-spacing:0}
#inline-filter .filter-editor [data-filter-count]{font-variant-numeric:tabular-nums}

/* 6 — Dar ekranda alttan açılan sayfa davranışı korunur */
@media(max-width:720px){
  #inline-filter .filter-editor{animation:none;max-height:86vh}
  #inline-filter .filter-editor .panel-head h2::after{display:none}
}
/* Alt cubuk duzeni: sayac solda, Sifirla ve Uygula sagda. */
#inline-filter .filter-editor .panel-actions{display:flex!important;align-items:center;gap:8px}
#inline-filter .filter-editor .panel-actions .btn.ghost{order:0!important}
#inline-filter .filter-editor [data-filter-count]{order:-1;margin-right:auto!important;flex:none;width:auto!important;white-space:nowrap;padding:5px 11px!important;align-self:center}
#inline-filter .filter-editor .panel-actions .btn{flex:none;min-width:auto}

/* ── Filtre: temizle dugmesi formdaki yuvarlakla ayni ── */
#inline-filter .filter-editor .filter-rule .btn.icon{
  width:24px!important;height:24px!important;min-height:24px!important;
  border-radius:50%!important;border:0!important;
  background:#E8EDF6!important;color:#5A6B82!important;opacity:1!important;
  display:none;place-items:center;transition:background-color .14s,color .14s}
#inline-filter .filter-editor .filter-rule .btn.icon svg{width:13px;height:13px;stroke-width:2.6}
#inline-filter .filter-editor .filter-rule .btn.icon:hover{background:#FCE4E6!important;color:#B3353B!important}
#inline-filter .filter-editor .filter-rule:has(select option:checked:not([value=""])) .btn.icon,
#inline-filter .filter-editor .filter-rule:has(input:not(:placeholder-shown)) .btn.icon{display:grid!important}
#inline-filter .filter-editor .filter-rule:hover .btn.icon,
#inline-filter .filter-editor .filter-rule:focus-within .btn.icon{opacity:1!important}

}

function filtered(module=route,rules=criteria){
  const query=lc(term);
  return db[module].filter(row=>{
    const all=fieldsFor(module).map(field=>display(module,row,field.key)).join(" ");
    return (!query||lc(all).includes(query))&&Object.entries(rules).every(([key,value])=>{
      if(!value)return true;
      if(key==="openOnly")return row.status!==stages[3];
      const rule=filterRule(key);
      const field=fieldOf(module,rule.key),raw=row[rule.key];
      if(!field||raw==null||raw==="")return false;
      if(rule.edge){const left=field.type==="number"?Number(raw):raw,right=field.type==="number"?Number(value):value;return rule.edge==="min"?left>=right:left<=right;}
      return ["text","textarea","email"].includes(field.type)?lc(raw).includes(lc(value)):String(raw)===String(value);
    });
  }).sort((a,b)=>{
    if(!sort.key)return 0;
    const key=sort.key,field=fieldOf(module,key);
    const x=key==="progress"?completion(a.id):field?.type==="relation"?display(module,a,key):a[key]??"";
    const y=key==="progress"?completion(b.id):field?.type==="relation"?display(module,b,key):b[key]??"";
    return sort.dir*(typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),"tr",{numeric:true}));
  });
}

function processInbox(rows){
  const statuses=fieldOf("workflows","status").options;
  // Kuyruk sırası: Onay bekliyor → İncelemede → Taslak → Onaylandı.
  // Tanımda olmayan ya da boş durumlar da bir bölüm alsın; hiçbir kayıt sessizce düşmesin.
  const ordered=[2,1,0,3].filter(i=>i<statuses.length).map(i=>statuses[i]);
  const extra=[...new Set(rows.map(row=>row.status).filter(s=>s&&!ordered.includes(s)))];
  const sections=[...ordered,...extra,...(rows.some(row=>!row.status)?[""]:[])];
  if(!rows.length)return empty();
  return '<div class="process-inbox">'+sections.map(status=>{
    const group=rows.filter(row=>(row.status||"")===status).sort((a,b)=>(a.end||"").localeCompare(b.end||""));
    if(!group.length)return "";
    const stage=Math.max(0,statuses.indexOf(status));
    const label=status||"Durum belirtilmemiş";
    return '<section class="queue-section"><header><i class="queue-dot s'+stage+'"></i><h2>'+e(label)+'</h2><span>'+group.length+'</span></header>'+group.map(row=>'<button type="button" class="queue-row" data-action="open" data-value="workflows|'+e(row.id)+'"><span class="queue-mark">'+svg("flow",18)+'</span><span class="queue-subject"><b>'+e(row.name)+'</b><small>'+e(row.code)+' · '+e(row.type)+' · '+e(row.unit)+'</small></span><span class="queue-path" aria-label="'+e(label)+'">'+statuses.map((item,i)=>'<i class="'+(i<=stage?"on":"")+'" title="'+e(item)+'"></i>').join("")+'<small>'+(stage+1)+'/'+statuses.length+' adım</small></span>'+person(row.owner)+'<time>'+e(dateText(row.end))+'</time>'+svg("right",15)+'</button>').join("")+'</section>';
  }).join("")+'</div>';
}

function schedule(rows){

    }).join("")+(!inRange.length?empty("Bu dönemde iş yok","Tarih aralığını veya filtreyi değiştir."):"")+'</div>';
  }

  }).join("")+'</div>';
}

function optionsOf(field,module,id){
  if(field.type==="relation")return db[field.options].filter(row=>row.id!==id&&(field.key!=="parent"||!isDescendant(row.id,id))).map(row=>[row.id,row.name||row.code]);
  return field.options.map(label=>[label,label]);
}
function isDescendant(child,parent){
  if(!parent)return false;
  const seen=new Set();
  while(child&&!seen.has(child)){
    if(child===parent)return true;
    seen.add(child);child=rowOf("roles",child)?.parent;
  }
  return false;
}

    start:"calendar",end:"calendar",due:"calendar",deadline:"calendar"};
  if(byKey[field.key])return byKey[field.key];

/* ─────────────────────────────────────────────────────────────────────
   İşlem geçmişi: mobildeki zaman çizelgesi (work_timeline.dart).
   Günlere ayrılır, en yenisi üstte; solda saat, ortada renkli düğüm ve
   dikey ray, sağda kart (tür + göreli zaman + açıklama).
   ───────────────────────────────────────────────────────────────────── */
const timelinePalette=["#4866C8","#1B9C6B","#E08A1E","#7C5CC4","#1597A6","#EC4899"];
function timelineTone(label){
  const key=String(label||"").trim().toLocaleUpperCase("tr");
  if(!key)return "#61738E";
  let sum=0;for(let i=0;i<key.length;i++)sum+=key.charCodeAt(i);
  return timelinePalette[sum%timelinePalette.length];
}
function timelineIcon(label){
  const key=String(label||"").toLocaleLowerCase("tr");
  if(key.includes("atan")||key.includes("atama"))return "user";
  if(key.includes("aşama")||key.includes("→"))return "flow";
  if(key.includes("oluştur")||key.includes("eklendi"))return "plus";
  if(key.includes("sil"))return "close";
  if(key.includes("güncel")||key.includes("düzen"))return "edit";
  if(key.includes("onay"))return "check";
  return "clock";
}
/** "Az önce", "5 dk önce", "3 saat önce", "2 gün önce", "4 ay önce". */
function timelineRelative(time,now){
  const diff=Math.max(0,now-time), minute=60000;
  if(diff<minute)return "az önce";
  if(diff<60*minute)return Math.floor(diff/minute)+" dk önce";
  if(diff<24*60*minute)return Math.floor(diff/(60*minute))+" saat önce";
  const days=Math.floor(diff/(24*60*minute));
  if(days<30)return days+" gün önce";
  return Math.floor(days/30)+" ay önce";
}
function historyTimeline(events){
  if(!events.length)return empty("Henüz işlem kaydedilmedi.","Kayıt üzerinde bir değişiklik yapıldığında burada görünür.");
  const now=Date.now();
  const dayFmt=new Intl.DateTimeFormat("tr-TR",{day:"numeric",month:"long",year:"numeric"});
  const timeFmt=new Intl.DateTimeFormat("tr-TR",{hour:"2-digit",minute:"2-digit"});
  const today=new Date().toDateString();
  const groups=new Map();
  for(const event of [...events].sort((a,b)=>new Date(b.time)-new Date(a.time))){
    const date=new Date(event.time),key=date.toDateString();
    if(!groups.has(key))groups.set(key,{date,items:[]});
    groups.get(key).items.push({event,date});
  }
  const dayHtml=({date,items})=>{
    const heading=date.toDateString()===today?"Bugün":dayFmt.format(date);
    const rows=items.map(({event,date:when},index)=>{
      const tone=timelineTone(event.verb);
      const position=(index===0?" first":"")+(index===items.length-1?" last":"");
      return '<div class="tl-row'+position+'" style="--accent:'+tone+'" data-tab-item>'+
        '<time class="tl-time">'+e(timeFmt.format(when))+'</time>'+
        '<span class="tl-rail" aria-hidden="true"><i></i></span>'+
        '<article class="tl-card"><header>'+svg(timelineIcon(event.verb),14)+
        '<span class="tl-kind">'+e(event.verb)+'</span>'+
        '<span class="tl-ago">'+e(timelineRelative(when.getTime(),now))+'</span></header>'+
        '<p>'+e(event.name||event.id||"")+'</p></article></div>';
    }).join("");
    return '<section class="tl-day"><h3>'+e(heading)+'<small>'+items.length+' işlem</small></h3>'+rows+'</section>';
  };
  return '<div class="work-timeline">'+[...groups.values()].map(dayHtml).join("")+'</div>';
}

function parseCsv(text){
  const source=text.replace(/^\uFEFF/,""), separator=source.split("\n")[0].includes(";")?";":",";
  let cell="",row=[],quoted=false;const rows=[];
  for(let i=0;i<source.length;i++){
    const c=source[i];
    if(c==='"'){
      if(quoted&&source[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;
    }else if(!quoted&&(c===separator||c==="\n")){
      row.push(cell);cell="";if(c==="\n"){rows.push(row);row=[];}
    }else if(c!=="\r"||quoted)cell+=c;
  }
  if(row.length||cell){row.push(cell);rows.push(row);}
  return rows;
}

function saveRecord(form,context=popup){
  const {module,draft}=context;
  const error=message=>showError(message,form);
  const values=Object.fromEntries([...new FormData(form)].map(([key,value])=>[key,String(value).trim()]));
  if(draft.id&&isLocked(module,rowOf(module,draft.id))){error("İşlenmiş kaydın detaylarını görüntüleyebilirsin.");return;}
  if(["payments","movements"].includes(module)&&values.status!=="Taslak"){error("Önce taslak olarak kaydet. Ardından detaydan işle.");return;}
  if(["movements","payments"].includes(module)&&Number(values[module==="movements"?"qty":"amount"])<=0){error("Sıfırdan büyük bir değer gir.");return;}
  if(module==="ledger"&&values.debit===values.credit){error("Borç ve alacak hesapları farklı olmalı.");return;}
  for(const field of fieldsFor(module)){
    if(field.required&&!values[field.key]){error(field.label+" alanını doldur.");return;}
    if(field.type==="number"&&values[field.key]!=="")values[field.key]=Number(values[field.key]);
  }
  if(db[module].some(row=>row.id!==draft.id&&lc(row.code)===lc(values.code))){error("Bu kayıt kodu kullanılıyor.");return;}
  if(values.start&&values.end&&values.end<values.start){error("Bitiş tarihi başlangıçtan önce olamaz.");return;}
  if(module==="roles"){
    if(values.parent&&isDescendant(values.parent,draft.id)){error("Üst görev olarak kendi alt görevlerinden biri seçilemez.");return;}
    for(const [key] of roleTabs.filter(([key])=>key!=="people"))values[key]=values[key].split(/\r?\n/).map(value=>value.trim()).filter(Boolean);
  }
  if(module==="pdks"&&values.type==="Alan değişikliği"&&(!values.oldArea||values.oldArea===values.newArea)){error("Alan değişikliği için eski ve yeni alan farklı olmalı.");return;}
  const row={...draft,...values,id:draft.id||makeId(module)};
  db[module]=draft.id?db[module].map(item=>item.id===draft.id?row:item):[row,...db[module]];
  log(module,row,draft.id?"Kayıt güncellendi":"Kayıt oluşturuldu");
  if(module==="people"&&row.candidate){const candidate=rowOf("candidates",row.candidate);if(candidate){candidate.status="İşe alındı";log("candidates",candidate,"Personel kartı açıldı");}}
  if(context.handoff||["movements","payments"].includes(module)){recordTab="info";openPopup({type:"record",module,id:row.id});render();persist("Kayıt kaydedildi.");return;}
  if(context===inlineDraft){inlineDraft=null;inspector=row.id;recordTab="info";}
  else closePopup();
  render();persist(draft.id?"Değişiklikler kaydedildi.":"Yeni kayıt oluşturuldu.");
}

function exportCsv(module){
  const config=modules[module];
  const columns=config?listColumns(module,split):["Modül","Kayıt sayısı"];
  const rows=config?[columns.map(key=>labelOf(module,key)),...filtered(module).map(row=>columns.map(key=>key==="progress"?completion(row.id):display(module,row,key)))]:[columns,...Object.entries(db).map(([id,items])=>[modules[id].label,items.length])];
  const quoted=value=>'"'+String(value??"").replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';
  const blob=new Blob(["\uFEFF"+rows.map(row=>row.map(quoted).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="TALES-"+module+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importCsv(form){
  const file=new FormData(form).get("file");
  if(!file||file.size>2*1024*1024){showError("2 MB’tan küçük bir CSV seç.");return;}
  const rows=parseCsv(await file.text());
  if(!form.isConnected)return;
  const headers=(rows.shift()||[]).map(lc);
  const keys=["code","name","status","type","parent","tags","notes"];
  const positions=keys.map(key=>headers.indexOf(lc(labelOf("roles",key))));
  if(positions[0]<0||positions[1]<0){showError("İlk satırda Kodu ve Adı sütunları gerekli.");return;}
  const known=new Set(db.roles.map(row=>lc(row.code)));
  const next=[];
  for(const line of rows){
    const row=Object.fromEntries(keys.map((key,i)=>[key,String(line[positions[i]]||"").trim()]));
    if(!row.name||!row.code||known.has(lc(row.code)))continue;
    known.add(lc(row.code));
    row.status=active.find(status=>lc(status)===lc(row.status))||"Aktif";
    row.type=fieldOf("roles","type").options.find(type=>lc(type)===lc(row.type))||"";
    row.parent=db.roles.find(item=>lc(item.code)===lc(row.parent)||lc(item.name)===lc(row.parent))?.id||"";
    next.push({...row,id:makeId("roles")});
  }
  if(!next.length){showError("Eklenebilecek yeni bir görev bulunamadı.");return;}
  db.roles=[...next,...db.roles];page=1;closePopup();render();persist(next.length+" görev eklendi.");
}

function annualLeaveStats(person,cutoff){
  const usedDates=new Set(),monthly=Array(12).fill(0);
  for(const row of db.leave){
    if(row.person!==person.id||row.type!=="Yıllık izin"||row.status!=="Onaylandı"||!row.start||!row.end)continue;
    const first=[row.start,leaveBookYear+"-01-01"].sort().at(-1);
    const last=[row.end,cutoff,leaveBookYear+"-12-31"].sort()[0];
    for(let d=first;d<=last;d=shift(d,1)){
      const weekday=new Date(d+"T12:00:00Z").getUTCDay();
      if(weekday>0&&weekday<6)usedDates.add(d);
    }
  }
  for(const d of usedDates)monthly[Number(d.slice(5,7))-1]++;
  const {carry,earned}=leaveOpening[person.id]||{carry:0,earned:0};
  return {person,carry,earned,used:usedDates.size,left:carry+earned-usedDates.size,monthly};
}
function leaveDashboard(){

  const stats=people.filter(p=>!leavePerson||p.id===leavePerson).map(p=>annualLeaveStats(p,cutoff));
  const sum=k=>stats.reduce((n,s)=>n+s[k],0);
  const opts=(items,current)=>items.map(([id,label])=>'<option value="'+e(id)+'" '+(id===current?"selected":"")+'>'+e(label)+'</option>').join("");
  const filters='<div class="hr-filter"><strong>'+svg("calendar")+' '+leaveBookYear+' izin dönemi</strong><label>Birim<select id="hr-unit"><option value="">Tüm birimler</option>'+opts([...new Set(db.people.map(p=>p.unit).filter(Boolean))].map(x=>[x,x]),leaveUnit)+'</select></label><label>Personel<select id="hr-person"><option value="">Tüm personeller</option>'+opts(people.map(p=>[p.id,p.name]),leavePerson)+'</select></label></div>';
  const monthly=monthNames.map((_,i)=>stats.reduce((n,s)=>n+s.monthly[i],0));
  const last=Math.max(-1,Math.min(11,(Number(cutoff.slice(0,4))-leaveBookYear)*12+Number(cutoff.slice(5,7))-1));

function moveWizard(form,delta){
  if(popup.loading)return;
  const step=popup.step||0,values=Object.fromEntries(new FormData(form));
  if(delta>0){
    for(const control of form.querySelectorAll('[data-wstep="'+step+'"] [name]'))if(!control.reportValidity())return;
    if(step===1&&values.end&&values.start&&values.end<values.start){showError("Bitiş tarihi başlangıçtan önce olamaz.",form);return;}
    if(step===0&&db.tasks.some(r=>lc(r.code)===lc(values.code))){showError("Bu iş kodu kullanılıyor.",form);return;}
  }
  popup.values=values;popup.step=Math.max(0,Math.min(3,step+delta));renderPopup();
  modal.querySelector('[data-wstep]:not([hidden]) input, [data-wstep]:not([hidden]) select')?.focus();
}

function groupedDetails(module,row){
  const val=key=>{
    if(key==="status"||key==="priority")return pill(row[key]);
    if(key==="owner"&&row.owner)return person(row.owner);
    const field=fieldOf(module,key);
    if(field?.type==="relation"&&row[key]&&rowOf(field.options,row[key]))return button(display(module,row,key),"open",{value:field.options+"|"+row[key],kind:"record-name linked-field",icon:"external"});
    if(key==="amount"||key==="cost")return e(module==="finance"?finMoney(row[key],row.currency):typeof oppMoney==="function"?oppMoney(row[key]):row[key]);
    if(key==="qty")return e(Number(row.qty||0).toLocaleString("tr"))+" adet";
    if(key==="probability")return '%'+e(row[key]);
    return e(display(module,row,key));
  };
  const has=key=>row[key]!==undefined&&row[key]!==null&&String(row[key]).trim()!=="";
  return '<div class="gcards">'+fieldGroups[module].map(([title,icon,tone,keys])=>{
    const shown=keys.filter(has);if(!shown.length)return "";
    const wide=shown.length===1&&shown[0]==="notes";
    return '<section class="gcard'+(wide?" wide":"")+'" style="--tone:'+tone+'"><header><span>'+svg(icon,17)+'</span><h3>'+e(title)+'</h3></header><dl>'+
      shown.map(k=>'<div class="'+(k==="notes"||k==="name"?"full":"")+'"><dt>'+e(labelOf(module,k))+'</dt><dd>'+val(k)+'</dd></div>').join("")+'</dl></section>';
  }).join("")+'</div>';
}

async function addWorkFiles(input,selection=input.files){
  const ctx=popup,files=[...selection],existing=ctx.draft.attachments||[];
  if(existing.length+files.length>5||[...existing,...files].reduce((a,f)=>a+f.size,0)>1048576){showError("En fazla 5 dosya ve toplam 1 MB seçebilirsin.",input.form);input.value="";return;}
  if(ctx.loading||!files.length)return;
  ctx.loading=true;input.disabled=true;input.closest("label")?.setAttribute("aria-busy","true");
  try{
    const additions=await Promise.all(files.map(async f=>({name:f.name,size:f.size,data:await new Promise((ok,fail)=>{const r=new FileReader();r.onload=()=>ok('data:application/octet-stream;base64,'+String(r.result).split(',')[1]);r.onerror=fail;r.readAsDataURL(f);})})));
    if(ctx===popup){ctx.draft.attachments=[...existing,...additions];ctx.dirty=true;renderPopup();}
  }catch{if(ctx===popup)showError("Dosya okunamadı.",input.form);}finally{ctx.loading=false;input.disabled=false;input.closest("label")?.removeAttribute("aria-busy");}

<script>

/* Filtre paneli dışına tıklanınca kapanır */
document.addEventListener("pointerdown",ev=>{

/* Filtre panelini Filtrele düğmesinin altına hizalar */
function placeFilterPopover(){
  const panel=document.getElementById("inline-filter"),btn=document.getElementById("filter-trigger");
  if(!panel||!btn||!panel.firstElementChild)return;
  const host=panel.offsetParent||panel.parentElement,hr=host.getBoundingClientRect(),br=btn.getBoundingClientRect();
  const width=Math.min(460,hr.width-16),right=Math.max(8,hr.right-br.right);

/* ===== Fırsatlarım: satış hunisi ve KPI şeridi ===== */
const oppStages=["Yeni","Görüşme","Teklif","Pazarlık","Kazanıldı","Kaybedildi"];

const oppMoney=v=>new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:0}).format(Number(v)||0);
const oppShort=v=>{const n=Number(v)||0;return n>=1e6?"₺"+(n/1e6).toLocaleString("tr-TR",{maximumFractionDigits:1})+" Mn":n>=1e3?"₺"+Math.round(n/1e3).toLocaleString("tr-TR")+" B":oppMoney(n);};
function oppOverview(){

function oppPipeline(rows){

/* ══════════════════════════════════════════════════════════════════════
   FİNANS — nakit pozisyonu, yaşlandırma, vade ajandası
   ══════════════════════════════════════════════════════════════════════ */
function finMoney(v,cur="TL"){const n=Number(v)||0,sym={TL:"₺",USD:"$",EUR:"€"}[cur||"TL"]||"₺";return sym+n.toLocaleString("tr",{maximumFractionDigits:0});}
function finShort(v){const n=Number(v)||0,a=Math.abs(n);return (n<0?"-":"")+"₺"+(a>=1e6?(a/1e6).toLocaleString("tr",{maximumFractionDigits:1})+" Mn":a>=1e3?(a/1e3).toLocaleString("tr",{maximumFractionDigits:1})+" B":a.toLocaleString("tr"));}
function finDays(r){if(!r.end)return null;return Math.round((new Date(r.end+"T00:00:00")-new Date(day()+"T00:00:00"))/864e5);}
function finDir(r){return r.type==="Alacak"?"in":"out";}
function finOverview(){
  const rows=db.finance||[],open=rows.filter(r=>r.status!=="Ödendi"),sum=a=>a.reduce((t,r)=>t+(Number(r.amount)||0),0);
  const inn=sum(open.filter(r=>finDir(r)==="in")),out=sum(open.filter(r=>finDir(r)==="out")),net=inn-out;
  const late=open.filter(r=>r.status==="Gecikti"||(finDays(r)??1)<0),week=open.filter(r=>{const d=finDays(r);return d!==null&&d>=0&&d<=7;});
  const paid=sum(rows.filter(r=>r.status==="Ödendi")),max=Math.max(inn,out,1);
  const buckets=[["Vadesi geçmiş",r=>(finDays(r)??1)<0,"#E5484D"],["0–30 gün",r=>{const d=finDays(r);return d!==null&&d>=0&&d<=30;},"#D98B21"],["31–60 gün",r=>{const d=finDays(r);return d>30&&d<=60;},"#4967F2"],["60+ gün",r=>{const d=finDays(r);return d===null||d>60;},"#7C8BA1"]];
  const bTotals=buckets.map(([l,m,c])=>[l,sum(open.filter(m)),c,open.filter(m).length]),bMax=Math.max(...bTotals.map(b=>b[1]),1);
  const cur=["TL","USD","EUR"].map(c=>[c,sum(open.filter(r=>(r.currency||"TL")===c))]).filter(x=>x[1]),cTot=cur.reduce((t,x)=>t+x[1],0)||1,cCol={TL:"#4967F2",USD:"#1B9C6B",EUR:"#D98B21"};
  let acc=0;const cone=cur.map(([c,v])=>{const a=acc;acc+=v/cTot*360;return cCol[c]+" "+a+"deg "+acc+"deg";}).join(",");
  return '<section class="fin-dash">'+
    '<article class="fin-hero"><header><span>Net nakit pozisyonu</span><em>'+open.length+' açık işlem</em></header>'+
      '<strong class="'+(net<0?"neg":"pos")+'">'+finShort(net)+'</strong><p>Açık alacaklar ile açık borç ve giderlerin farkı</p>'+
      '<div class="fin-flow"><div><small><i class="in"></i>Tahsil edilecek</small><b>'+finShort(inn)+'</b><span><i class="in" style="width:'+(inn/max*100)+'%"></i></span></div>'+
      '<div><small><i class="out"></i>Ödenecek</small><b>'+finShort(out)+'</b><span><i class="out" style="width:'+(out/max*100)+'%"></i></span></div></div></article>'+
    '<div class="fin-kpis">'+
      '<a class="fin-kpi" href="#finance?status=Gecikti" style="--tone:#E5484D"><small>Geciken</small><b>'+finShort(sum(late))+'</b><span>'+late.length+' işlem · hemen ilgilen</span></a>'+
      '<div class="fin-kpi" style="--tone:#D98B21"><small>Bu hafta vadesi gelen</small><b>'+finShort(sum(week))+'</b><span>'+week.length+' işlem</span></div>'+
      '<div class="fin-kpi" style="--tone:#1B9C6B"><small>Ödenen / tahsil edilen</small><b>'+finShort(paid)+'</b><span>kapanan işlemler</span></div>'+
    '</div>'+
    '<article class="fin-panel fin-aging"><header><h3>Vade yaşlandırma</h3><small>Açık tutarlar</small></header>'+bTotals.map(([l,v,c,n])=>
      '<div class="fin-bar"><span>'+l+'</span><i><b style="width:'+(v/bMax*100)+'%;background:'+c+'"></b></i><strong>'+finShort(v)+'</strong><em>'+n+'</em></div>').join("")+'</article>'+
    '<article class="fin-panel fin-cur"><header><h3>Para birimi</h3><small>Açık tutar dağılımı</small></header><div class="fin-donut" style="background:conic-gradient('+(cone||"#E3E8F0 0deg 360deg")+')"><span>'+cur.length+'<small>birim</small></span></div>'+
      '<ul>'+cur.map(([c,v])=>'<li><i style="background:'+cCol[c]+'"></i>'+c+'<b>%'+Math.round(v/cTot*100)+'</b></li>').join("")+'</ul></article>'+
  '</section>';
}
function finAgenda(rows){
  const groups=[["Vadesi geçmiş","late",r=>r.status!=="Ödendi"&&(finDays(r)??1)<0],["Bu hafta","week",r=>r.status!=="Ödendi"&&finDays(r)!==null&&finDays(r)>=0&&finDays(r)<=7],["Bu ay","month",r=>r.status!=="Ödendi"&&finDays(r)>7&&finDays(r)<=30],["Daha sonra","later",r=>r.status!=="Ödendi"&&(finDays(r)===null||finDays(r)>30)],["Kapananlar","done",r=>r.status==="Ödendi"]];

function finHero(r){

    '<ol class="fin-steps">'+steps.map((s,i)=>'<li class="'+(i<at?"done":"")+'"><i>'+(i<at?svg("check",12):i+1)+'</i>'+s+'</li>').join("")+'</ol></section>';
}
/* ══════════════════════════════════════════════════════════════════════

.ik2-btn.bad{background:#FDEDEE;border-color:#F5CCD0;color:var(--bad)}.ik2-btn.bad:hover{background:#FBDDE0}
.ik2-btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:9px}
.ik2-count{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;display:inline-grid;place-items:center}
/* Bölüm gezintisi */
.ik2-nav{display:flex;gap:4px;padding:5px;margin:0 0 18px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow-x:auto;scrollbar-width:thin}
.ik2-nav a{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;color:#4A5470;font-size:13.5px;font-weight:620;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s}
.ik2-nav a:hover{background:var(--bg);color:var(--ink)}
.ik2-nav a.on{background:var(--ac);color:#fff;box-shadow:0 3px 10px #4F46E533}
.ik2-nav a em{font-style:normal;font-size:11px;font-weight:750;padding:1px 6px;border-radius:999px;background:#FDE8EA;color:var(--bad)}
.ik2-nav a.on em{background:#ffffff2e;color:#fff}
/* Kartlar, paneller */
.ik2-grid{display:grid;gap:14px}
.ik2-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:14px}
.ik2-kpi{position:relative;padding:15px 16px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ik2-kpi::after{content:"";position:absolute;right:-22px;top:-22px;width:80px;height:80px;border-radius:50%;background:color-mix(in srgb,var(--t,#4F46E5) 9%,transparent)}
.ik2-kpi>span{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:color-mix(in srgb,var(--t,#4F46E5) 13%,#fff);color:var(--t,#4F46E5);margin-bottom:10px}
.ik2-kpi small{display:block;color:var(--mut);font-size:12.5px;font-weight:600}
.ik2-kpi b{display:block;font-size:1.6rem;font-weight:780;letter-spacing:-.02em;margin-top:2px}
.ik2-kpi em{font-style:normal;font-size:12px;color:var(--t,#4F46E5);font-weight:650}
.ik2-panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.ik2-panel>header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ik2-panel h2{margin:0;font-size:15px;font-weight:720}
.ik2-panel>header small{color:var(--mut);font-size:12.5px}
.ik2-panel>header a,.ik2-link{color:var(--ac);font-size:12.5px;font-weight:650;text-decoration:none;background:none;border:0;padding:0}
.ik2-cols{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:1/-1}
@media(max-width:1100px){.c4,.c5,.c6,.c7,.c8{grid-column:1/-1}}
/* Avatar, çip */
.ik2-av{display:inline-grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;color:#fff;font-size:12px;font-weight:750;box-shadow:0 0 0 2px #fff}
.ik2-av.sm{width:26px;height:26px;font-size:10px}.ik2-av.lg{width:64px;height:64px;font-size:20px;box-shadow:0 0 0 4px #fff,0 6px 18px #141B2D22}
.ik2-chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:680;white-space:nowrap;background:color-mix(in srgb,var(--t,#64748B) 12%,#fff);color:var(--t,#475569)}
.ik2-chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.ik2-who{display:flex;align-items:center;gap:10px;min-width:0}
.ik2-who b{display:block;font-size:13.5px;font-weight:680;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ik2-who small{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ik2-who>div{min-width:0}
/* Liste satırları */
.ik2-rows{display:grid}
.ik2-row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid #F0F2F7}
.ik2-row:first-child{border-top:0}
.ik2-row .end{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.ik2-empty{padding:26px 10px;text-align:center;color:var(--mut);font-size:13px}
/* Tablolar */
.ik2-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.ik2-tablewrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:auto}
.ik2-table th{position:sticky;top:0;background:#FAFBFD;text-align:left;font-size:11.5px;font-weight:700;color:var(--mut);letter-spacing:.03em;text-transform:uppercase;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.ik2-table td{padding:11px 14px;border-bottom:1px solid #F0F2F7;vertical-align:middle;white-space:nowrap}
.ik2-table tr:last-child td{border-bottom:0}
.ik2-table tbody tr{transition:background .12s}
.ik2-table tbody tr[data-ik]{cursor:pointer}
.ik2-table tbody tr:hover{background:#FAFBFF}
.ik2-table .num{text-align:right}
.ik2-code{font:600 11.5px/1 ui-monospace,Consolas,monospace;color:var(--mut)}
/* Araç çubuğu */
.ik2-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ik2-search{display:flex;align-items:center;gap:8px;height:40px;min-width:min(320px,100%);padding:0 12px;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--mut)}
.ik2-search:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px #4F46E522}
.ik2-search input{flex:1;border:0!important;outline:0;background:transparent!important;box-shadow:none!important;font:inherit;font-size:13.5px;color:var(--ink);min-width:0}
.ik2-seg{display:inline-flex;gap:2px;padding:3px;background:#EEF0F5;border-radius:11px}
.ik2-seg button{height:32px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:#4A5470;font-size:12.5px;font-weight:650;display:inline-flex;align-items:center;gap:6px}
.ik2-seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #141B2D1f}
.ik2-seg button em{font-style:normal;font-size:11px;color:var(--mut)}
.ik2-spacer{flex:1}
/* Personel kartları */
.ik2-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ik2-pcard{display:grid;gap:10px;text-align:left;padding:16px;background:#fff;border:1px solid var(--line);border-radius:16px;transition:border-color .15s,box-shadow .15s,transform .15s}
.ik2-pcard:hover{border-color:#CBD0F5;box-shadow:0 8px 22px #141B2D12;transform:translateY(-2px)}
.ik2-pcard header{display:flex;align-items:center;gap:11px}
.ik2-pcard header .ik2-av{width:46px;height:46px;font-size:15px}
.ik2-pcard dl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0;padding-top:10px;border-top:1px solid #F0F2F7}
.ik2-pcard dt{font-size:11px;color:var(--mut);font-weight:600}.ik2-pcard dd{margin:0;font-size:13px;font-weight:650}
.ik2-meter{height:6px;border-radius:9px;background:#EEF0F5;overflow:hidden}.ik2-meter i{display:block;height:100%;border-radius:9px;background:var(--t,var(--ac))}
/* Bar listesi */
.ik2-bars{display:grid;gap:9px}
.ik2-bar{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:10px;font-size:13px}
.ik2-bar span{color:#4A5470;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ik2-bar b{text-align:right}
/* Donut */
.ik2-donut{width:132px;height:132px;border-radius:50%;flex:none;display:grid;place-items:center;-webkit-mask:radial-gradient(circle,transparent 0 46px,#000 47px);mask:radial-gradient(circle,transparent 0 46px,#000 47px)}
.ik2-donutwrap{display:flex;align-items:center;gap:20px}
.ik2-legend{display:grid;gap:7px;font-size:13px;flex:1}
.ik2-legend div{display:flex;align-items:center;gap:8px}.ik2-legend i{width:10px;height:10px;border-radius:3px}.ik2-legend b{margin-left:auto}
/* Aylık sütun grafik */
.ik2-cols-chart{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:6px}
.ik2-cols-chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.ik2-cols-chart i{width:100%;max-width:28px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#818CF8,#4F46E5)}
.ik2-cols-chart small{font-size:11px;color:var(--mut)}.ik2-cols-chart b{font-size:11px}
/* Adım göstergesi */
.ik2-steps{display:flex;align-items:center;gap:4px}
.ik2-steps i{width:18px;height:6px;border-radius:9px;background:#E4E7EE}
.ik2-steps i.done{background:var(--ok)}.ik2-steps i.now{background:var(--warn)}.ik2-steps i.no{background:var(--bad)}
.ik2-vsteps{display:grid;gap:0;margin:4px 0}
.ik2-vstep{display:grid;grid-template-columns:30px 1fr;gap:12px;position:relative;padding-bottom:16px}
.ik2-vstep::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:#E4E7EE}
.ik2-vstep:last-child::before{display:none}
.ik2-vstep>span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#EEF0F5;color:var(--mut);font-size:12px;font-weight:750}
.ik2-vstep.done>span{background:var(--ok);color:#fff}.ik2-vstep.now>span{background:var(--warn);color:#fff;box-shadow:0 0 0 5px #C777121f}.ik2-vstep.no>span{background:var(--bad);color:#fff}
.ik2-vstep b{font-size:13.5px}.ik2-vstep small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.ik2-vstep p{margin:6px 0 0;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:12.5px;color:#3B4560}
/* Takvim (ekip zaman çizelgesi) */
.ik2-cal{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}
.ik2-cal table{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.ik2-cal th,.ik2-cal td{border-bottom:1px solid #F0F2F7;border-right:1px solid #F4F5F9;height:36px;padding:0;text-align:center;min-width:30px}
.ik2-cal th{position:sticky;top:0;background:#FAFBFD;font-weight:700;color:var(--mut);font-size:11px;z-index:1}
.ik2-cal th small{display:block;font-weight:600;font-size:10px}
.ik2-cal td.name,.ik2-cal th.name{position:sticky;left:0;background:#fff;text-align:left;padding:0 12px;min-width:190px;z-index:2}
.ik2-cal th.name{background:#FAFBFD;z-index:3}
.ik2-cal .we{background:#F8F9FB}.ik2-cal .hol{background:#FFF6E8}.ik2-cal .today{box-shadow:inset 0 0 0 2px var(--ac)}
.ik2-cal .lv{display:block;margin:5px 1px;height:24px;border-radius:6px;background:var(--t);opacity:.9}
.ik2-cal .lv.pend{background:repeating-linear-gradient(45deg,var(--t),var(--t) 4px,#fff 4px,#fff 7px);opacity:.75}
.ik2-legendrow{display:flex;gap:14px;flex-wrap:wrap;margin:10px 2px;font-size:12px;color:var(--mut)}
.ik2-legendrow span{display:inline-flex;align-items:center;gap:6px}.ik2-legendrow i{width:12px;height:12px;border-radius:4px;background:var(--t)}
/* Kanban (işe alım) */
.ik2-kanban{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.ik2-lane{background:#F4F5FA;border-radius:16px;padding:10px;min-height:240px}
.ik2-lane>header{display:flex;align-items:center;gap:8px;padding:4px 4px 10px;font-weight:700;font-size:13.5px}
.ik2-lane>header i{width:9px;height:9px;border-radius:50%;background:var(--t)}
.ik2-lane>header em{font-style:normal;margin-left:auto;font-size:12px;color:var(--mut)}
.ik2-ccard{display:grid;gap:6px;padding:12px;margin-bottom:8px;background:#fff;border:1px solid var(--line);border-radius:13px;font-size:12.5px}
.ik2-ccard b{font-size:13.5px}.ik2-ccard small{color:var(--mut)}
.ik2-stars{color:#F5A524;letter-spacing:1px;font-size:12px}
/* Organizasyon şeması */
.ik2-org{display:grid;justify-items:center;gap:22px}
.ik2-orgtop{position:relative}
.ik2-orgnode{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px #141B2D0d;text-align:left}
.ik2-orgunits{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;width:100%}
.ik2-orgunit{background:#fff;border:1px solid var(--line);border-top:3px solid var(--t);border-radius:14px;padding:12px}
.ik2-orgunit h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.ik2-orgunit h3 em{font-style:normal;margin-left:auto;font-size:12px;color:var(--mut)}
.ik2-orgunit .mgr{padding:8px;border-radius:11px;background:color-mix(in srgb,var(--t) 8%,#fff);margin-bottom:8px}
.ik2-orgunit ul{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid #EEF0F5;display:grid;gap:6px}
/* Katman: çekmece ve pencere */
#ik2-layer{position:fixed;inset:0;z-index:80;display:none}
#ik2-layer.open{display:block}
.ik2-shade{position:absolute;inset:0;background:#141B2D59;backdrop-filter:blur(2px);animation:ik2fade .15s ease}
.ik2-drawer{position:absolute;right:0;top:0;bottom:0;width:min(860px,100%);background:#F7F8FB;box-shadow:-18px 0 40px #141B2D2e;display:flex;flex-direction:column;animation:ik2slide .22s cubic-bezier(.22,1,.36,1)}
.ik2-dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(820px,calc(100% - 24px));max-height:calc(100% - 40px);background:#F7F8FB;border-radius:20px;box-shadow:0 30px 70px #141B2D40;display:flex;flex-direction:column;overflow:hidden;animation:ik2pop .18s cubic-bezier(.22,1,.36,1)}
.ik2-dialog.sm{width:min(480px,calc(100% - 24px))}
@keyframes ik2fade{from{opacity:0}}@keyframes ik2slide{from{transform:translateX(40px);opacity:0}}@keyframes ik2pop{from{transform:translate(-50%,-48%) scale(.98);opacity:0}}
.ik2-dhead{display:flex;align-items:center;gap:14px;padding:18px 22px;background:#fff;border-bottom:1px solid var(--line)}
.ik2-dhead h2{margin:0;font-size:18px;font-weight:760}.ik2-dhead p{margin:2px 0 0;color:var(--mut);font-size:13px}
.ik2-x{margin-left:auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--mut)}
.ik2-dbody{flex:1;overflow:auto;padding:18px 22px}
.ik2-dfoot{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:14px 22px;background:#fff;border-top:1px solid var(--line)}
.ik2-dfoot small{margin-right:auto;color:var(--mut);font-size:12px}
.ik2-hero{display:flex;align-items:center;gap:16px;padding:20px 22px;background:linear-gradient(135deg,#fff 0%,#F2F3FF 100%);border-bottom:1px solid var(--line)}
.ik2-hero h2{margin:0;font-size:20px;font-weight:780}.ik2-hero p{margin:3px 0 8px;color:var(--mut);font-size:13px}
.ik2-hero .chips{display:flex;gap:6px;flex-wrap:wrap}
.ik2-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line)}
.ik2-stats div{padding:8px 10px;border-radius:12px;background:var(--bg)}.ik2-stats small{display:block;font-size:11.5px;color:var(--mut);font-weight:600}.ik2-stats b{font-size:16px}
.ik2-tabs{display:flex;gap:2px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.ik2-tabs button{height:44px;padding:0 12px;border:0;background:none;color:var(--mut);font-size:13px;font-weight:650;white-space:nowrap;border-bottom:2px solid transparent}
.ik2-tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
.ik2-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.ik2-card h3{margin:0 0 10px;font-size:14px;font-weight:720}
.ik2-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px;margin:0}
.ik2-facts div{padding:8px 0;border-top:1px solid #F0F2F7}
.ik2-facts div:nth-child(-n+2){border-top:0}
.ik2-facts dt{font-size:11.5px;color:var(--mut);font-weight:600}.ik2-facts dd{margin:2px 0 0;font-size:13.5px;font-weight:620;overflow-wrap:anywhere}
.ik2-facts .full{grid-column:1/-1}
/* Formlar */
.ik2-form{display:grid;gap:12px}
.ik2-fgroup{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.ik2-fgroup h3{margin:0 0 10px;font-size:13.5px;font-weight:720}
.ik2-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ik2-f{display:grid;gap:5px;min-width:0}
.ik2-f.full{grid-column:1/-1}
.ik2-f label{font-size:12px;font-weight:650;color:#4A5470}.ik2-f label i{color:var(--bad);font-style:normal}
.ik2-f input,.ik2-f select,.ik2-f textarea{width:100%;height:40px;padding:0 11px;border:1px solid #D9DEE8!important;border-radius:10px!important;background:#fff!important;font:inherit;font-size:13.5px;color:var(--ink);box-shadow:none!important}
.ik2-f textarea{height:auto;min-height:74px;padding:9px 11px;resize:vertical}
.ik2-f input:focus,.ik2-f select:focus,.ik2-f textarea:focus{outline:0;border-color:var(--ac)!important;box-shadow:0 0 0 3px #4F46E522!important}
.ik2-f .hint{font-size:11.5px;color:var(--mut)}
.ik2-check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.ik2-preview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ik2-preview div{padding:10px 12px;border-radius:12px;background:var(--soft)}
.ik2-preview small{display:block;font-size:11.5px;color:var(--mut);font-weight:600}.ik2-preview b{font-size:17px}
.ik2-alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:13px;margin-top:10px}
.ik2-alert.warn{background:#FFF6E8;color:#8A5310}.ik2-alert.bad{background:#FDEDEE;color:#A32E37}.ik2-alert.info{background:#EEF0FF;color:#3730A3}
/* Sade kurumsal KPI kartları */
.ik2-kpi{padding:14px 16px;border-radius:12px;box-shadow:none;border-left:3px solid var(--t,#4F46E5)}
.ik2-kpi::after{display:none}
.ik2-kpi>span{display:none}
.ik2-kpi small{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#6B7489}
.ik2-kpi b{font-size:1.5rem;color:#141B2D;margin-top:4px}
.ik2-kpi em{color:#6B7489;font-weight:550}
.ik2-panel{border-radius:12px}
/* Butonlar: dolu renk, beyaz ikon ve yazı */
.ik2-btn,.ik2-btn.sm{background:#4F46E5;border-color:#4F46E5;color:#fff}
.ik2-btn:hover{background:#4338CA;border-color:#4338CA;color:#fff}
.ik2-btn svg{color:#fff}
.ik2-btn.ok{background:#12936A;border-color:#12936A;color:#fff}.ik2-btn.ok:hover{background:#0E7A57}
.ik2-btn.bad{background:#D23F4A;border-color:#D23F4A;color:#fff}.ik2-btn.bad:hover{background:#B5323C}
.ik2-btn.primary{background:#312E81;border-color:#312E81;box-shadow:none}.ik2-btn.primary:hover{background:#262361}
.ik2-btn .ik2-count{background:#fff;color:#D23F4A}
.ik2-btn .ik2-av{box-shadow:0 0 0 1.5px #fff}
/* Sekmeler: kaydırmasız, karo düzeni */
.ik2-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:0;background:none;border:0;overflow:visible}
.ik2-nav a{position:relative;display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#2B3550;font-size:13px;white-space:normal;line-height:1.2}
.ik2-nav a svg{flex:none;width:18px;height:18px;padding:6px;box-sizing:content-box;border-radius:9px;background:#F1F2F8;color:#4F46E5}
.ik2-nav a:hover{border-color:#C9CFE8;background:#fff;box-shadow:0 3px 10px #141B2D0f}
.ik2-nav a.on{background:#312E81;border-color:#312E81;color:#fff;box-shadow:0 6px 16px #312E8133}
.ik2-nav a.on svg{background:#ffffff1f;color:#fff}
.ik2-nav a em{position:absolute;top:-7px;right:-6px;background:#D23F4A;color:#fff;border:2px solid #F6F7FB}

/* Yıllık izin hakkı (İş Kanunu m.53): 1–5 yıl 14, 5–15 yıl 20, 15+ yıl 26; 18 yaş altı ve 50 üstü en az 20 */
function entitlement(p){const y=yearsBetween(p.start),age=yearsBetween(p.birth);if(y<1)return 0;let n=y<5?14:y<15?20:26;if(age<18||age>=50)n=Math.max(n,20);return n;}
function balance(p){
  const yr=T.slice(0,4),mine=S.leaves.filter(l=>l.person===p.id&&l.type==="annual"&&l.start.slice(0,4)===yr);
  const used=p.usedBase+mine.filter(l=>l.status==="Onaylandı"&&l.start<=T).reduce((n,l)=>n+l.days,0);
  const planned=mine.filter(l=>l.status==="Onaylandı"&&l.start>T).reduce((n,l)=>n+l.days,0);
  const pending=mine.filter(l=>l.status==="Onay bekliyor").reduce((n,l)=>n+l.days,0);
  const earned=entitlement(p),total=earned+p.carry;
  return {earned,carry:p.carry,used,planned,pending,total,left:total-used-planned};
}
const onLeave=(id,d=T)=>S.leaves.find(l=>l.person===id&&l.status==="Onaylandı"&&l.start<=d&&l.end>=d);
const pendingAll=()=>[...S.leaves.filter(l=>l.status==="Onay bekliyor").map(x=>["leave",x]),...S.overtime.filter(o=>o.status==="Onay bekliyor").map(x=>["overtime",x]),...S.expenses.filter(x=>x.status==="Onay bekliyor").map(x=>["expense",x]),...S.people.flatMap(p=>p.assets.filter(a=>a.state==="Onay bekliyor").map(a=>["asset",{...a,person:p.id,id:p.id+"|"+a.serial}]))];

/* Bugünün PDKS hareketleri (tohum + gün) */
function attendance(){
  return active().map((p,i)=>{
    const lv=onLeave(p.id);if(lv)return {p,state:"İzinli",tone:"#0EA5E9",lv};
    if(isWe(T)||isHol(T))return {p,state:"Tatil",tone:"#94A3B8"};
    const seed=(Number(T.slice(8))+i*7)%23;
    if(seed===4)return {p,state:"Gelmedi",tone:"#D23F4A"};
    const sh=SHIFTS.find(s=>s.id===p.shift)||SHIFTS[0],base=sh.id==="E"?7*60:sh.id==="A"?14*60:9*60;
    const inMin=base-25+((seed*7)%45),late=inMin>base+10;
    const where=p.model==="Saha"?"Saha":p.model==="Hibrit"&&seed%2?"Uzaktan":"Merkez Ofis";
    const now=new Date(),nowMin=now.getHours()*60+now.getMinutes();
    const outMin=nowMin>base+9*60?base+9*60+((seed*5)%50):null;
    const f=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
    return {p,state:late?"Geç geldi":where==="Uzaktan"?"Uzaktan":where==="Saha"?"Sahada":"Ofiste",tone:late?"#C77712":where==="Uzaktan"?"#7C3AED":where==="Saha"?"#0D9488":"#12936A",
      in:f(inMin),out:outMin?f(outMin):"",lateMin:late?inMin-base:0,where,gps:seed===11?"Şüpheli konum":"",shift:sh,
      worked:outMin?((outMin-inMin)/60).toFixed(1)+" sa":Math.max(0,(Math.min(nowMin,base+9*60)-inMin)/60).toFixed(1)+" sa"};
  });
}

const KIND={leave:["İzin","calendar","#4F46E5"],overtime:["Fazla mesai","clock","#D97706"],expense:["Avans / masraf","money","#12936A"],asset:["Zimmet","box","#7C3AED"]};

    return '<div class="ik2-pcard" style="cursor:default"><div style="display:flex;gap:6px">'+chip(t.kind,t.req?"#D23F4A":"#4F46E5")+chip(t.hours+" saat","#64748B")+'</div><b style="font-size:15px">'+esc(t.name)+'</b><small style="color:'+(late?"#D23F4A":"#6B7489")+'">Son tarih: '+dlong(t.due)+(late?" · gecikmede":"")+'</small><div style="display:flex;justify-content:space-between;font-size:12.5px"><span>'+done+' / '+t.people.length+' tamamladı</span><b>%'+pct+'</b></div><div class="ik2-meter" style="--t:'+(pct===100?"#12936A":late?"#D23F4A":"#4F46E5")+'"><i style="width:'+pct+'%"></i></div><div style="display:flex">'+t.people.filter(x=>!x.done).slice(0,6).map(x=>'<span title="'+esc(pname(x.id))+' · tamamlamadı" style="margin-right:-6px">'+av(pname(x.id),"sm")+'</span>').join("")+'</div></div>';}).join("")+'</div></section>'+
    '<section class="ik2-panel c4"><header><h2>Süresi dolan belgeler</h2><small>60 gün</small></header><div class="ik2-rows">'+(exp.map(x=>'<div class="ik2-row" data-ik="person" data-v="'+x.p.id+'" data-tab="docs" style="cursor:pointer">'+who(x.p,x.d.name)+'<div class="end">'+chip(x.n<0?Math.abs(x.n)+" gün geçti":x.n+" gün",x.n<0?"#D23F4A":x.n<15?"#C77712":"#4F46E5")+'</div></div>').join("")||'<p class="ik2-empty">Yakında süresi dolan belge yok</p>')+'</div></section></div>';
}

/* ─── Performans ─── */
function secPerf(){

    '<section class="ik2-panel c7"><header><h2>Birim hedefleri</h2><small>'+T.slice(0,4)+' dönemi</small></header><div class="ik2-rows">'+S.goals.map(([g,u,pct])=>'<div class="ik2-row" style="display:grid;grid-template-columns:1fr 160px 44px;gap:12px"><div><b style="font-size:13.5px">'+esc(g)+'</b><div>'+chip(unitOf(u)[1],unitOf(u)[2])+'</div></div><div class="ik2-meter" style="--t:'+(pct>=70?"#12936A":pct>=45?"#D97706":"#D23F4A")+'"><i style="width:'+pct+'%"></i></div><b>%'+pct+'</b></div>').join("")+'</div></section>'+

}

/* ═════════════ Çekmece: personel dosyası ═════════════ */
function personDrawer(id,tab){
  const p=P(id),b=balance(p),u=unitOf(p.unit),mgr=P(p.manager);
  const myL=S.leaves.filter(l=>l.person===id).sort((a,c)=>c.start.localeCompare(a.start));
  const score=p.score.award-p.score.penalty+S.scores.filter(s=>s.person===id).reduce((n,s)=>n+s.pts,0);
  const tabs=[["general","Genel"],["personal","Özlük & iletişim"],["edu","Eğitim & dil"],["career","Kariyer"],["leave","İzinler"],["pdks","PDKS"],["assets","Zimmet"],["perf","Performans"],["docs","Belgeler"],["pay","Bordro & banka"]];
  const facts=list=>'<dl class="ik2-facts">'+list.filter(([,v])=>!blank(v)).map(([k,v,full])=>'<div class="'+(full?"full":"")+'"><dt>'+esc(k)+'</dt><dd>'+(v===undefined||v===""?"—":v)+'</dd></div>').join("")+'</dl>';
  let body;
  switch(tab){
    case "personal":body='<div class="ik2-card"><h3>Kimlik ve özlük</h3>'+facts([["Ad",esc(p.first)],["Soyad",esc(p.last)],["T.C. kimlik no",esc(p.tc)],["Uyruk",esc(p.nationality)],["Doğum yeri",esc(p.birthPlace)],["Doğum tarihi",dlong(p.birth)+" ("+yearsBetween(p.birth)+" yaş)"],["Cinsiyet",esc(p.gender)],["Medeni durum",esc(p.marital)],["Çocuk sayısı",p.children],["Kan grubu",esc(p.blood)],["Engellilik",esc(p.disability)],["Askerlik",esc(p.military)],["Ehliyet",esc(p.license)]])+'</div><div class="ik2-card"><h3>İletişim</h3>'+facts([["GSM",esc(p.gsm)],["Dahili",esc(p.ext)],["Ev telefonu",esc(p.homePhone)],["İş e-postası",esc(p.email)],["Kişisel e-posta",esc(p.personalEmail)],["Şehir",esc(p.city)],["Adres",esc(p.address),true]])+'</div><div class="ik2-card"><h3>Acil durumda ulaşılacak kişi</h3>'+facts([["Ad soyad",esc(p.emergency.name)],["Yakınlık",esc(p.emergency.rel)],["Telefon",esc(p.emergency.phone)]])+'</div>';break;
    case "edu":body='<div class="ik2-card"><h3>Eğitim</h3>'+p.edu.map(x=>facts([["Okul",esc(x.school)],["Bölüm",esc(x.dept)],["Derece",esc(x.degree)],["Mezuniyet",esc(x.year)]])).join("")+'</div><div class="ik2-card"><h3>Yabancı dil</h3><div class="ik2-rows">'+p.langs.map(l=>'<div class="ik2-row"><b>'+esc(l.name)+'</b><div class="end">'+chip(l.level,"#4F46E5")+'</div></div>').join("")+'</div></div><div class="ik2-card"><h3>Sertifikalar</h3><div class="ik2-rows">'+p.certs.map(c=>'<div class="ik2-row">'+ic("award",16)+'<b>'+esc(c)+'</b></div>').join("")+'</div></div>';break;
    case "career":body='<div class="ik2-card"><h3>Görev ve kadro</h3>'+facts([["Birim",esc(u[1])],["Unvan",esc(p.title)],["Yönetici",esc(mgr?.name||"Genel Müdür")],["Sözleşme",esc(p.contract)+(p.contractEnd?" · bitiş "+dlong(p.contractEnd):"")],["Çalışma modeli",esc(p.model)],["Vardiya",esc((SHIFTS.find(s=>s.id===p.shift)||{}).name||"")]])+'</div><div class="ik2-card"><h3>Kariyer geçmişi</h3><div class="ik2-vsteps">'+p.career.slice().reverse().map(c=>'<div class="ik2-vstep done"><span>'+ic("flag",13)+'</span><div><b>'+esc(c.type)+'</b><small>'+dlong(c.date)+' · '+esc(c.detail)+'</small></div></div>').join("")+'</div></div>';break;
    case "leave":body='<div class="ik2-preview" style="margin-bottom:12px">'+[["Hak edilen",b.earned],["Devreden",b.carry],["Kullanılan",b.used],["Kalan",b.left]].map(([k,v])=>'<div><small>'+k+'</small><b>'+v+' gün</b></div>').join("")+'</div><div class="ik2-card"><h3>İzin talepleri</h3>'+(myL.length?'<div class="ik2-rows">'+myL.map(l=>'<div class="ik2-row" data-ik="leave" data-v="'+l.id+'" style="cursor:pointer">'+chip(lt(l.type).name,lt(l.type).color)+'<span>'+dshort(l.start)+' – '+dshort(l.end)+' · <b>'+l.days+' gün</b></span><div class="end">'+st(l.status)+'</div></div>').join("")+'</div>':'<p class="ik2-empty">İzin kaydı yok</p>')+'</div>';break;
    case "pdks":{const a=attendance().find(x=>x.p.id===id);const hist=Array.from({length:10},(_,i)=>shift(T,-i-1)).filter(d=>!isWe(d)&&!isHol(d)).slice(0,7);
      body='<div class="ik2-card"><h3>Bugün</h3>'+(a?facts([["Durum",chip(a.state,a.tone)],["Vardiya",a.shift?esc(a.shift.name+" "+a.shift.time):"—"],["Giriş",a.in||"—"],["Çıkış",a.out||"—"],["Konum",esc(a.where||"—")],["GPS",a.gps?chip(a.gps,"#D23F4A"):"Doğrulandı"]]):"<p class='ik2-empty'>Kayıt yok</p>")+'</div><div class="ik2-card"><h3>Son hareketler</h3><div class="ik2-rows">'+hist.map((d,i)=>{const lv=onLeave(id,d);const m=8*60+40+((i*13+Number(id.slice(1)))%40);return '<div class="ik2-row"><b style="min-width:110px">'+dlong(d)+'</b>'+(lv?chip("İzinli","#0EA5E9"):'<span>'+String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")+' → 18:'+String(5+i*3).padStart(2,"0")+'</span>')+'<div class="end">'+(lv?"":m>9*60+10?chip("Geç","#C77712"):chip("Zamanında","#12936A"))+'</div></div>';}).join("")+'</div></div>';break;}
    case "assets":body='<div class="ik2-card"><h3>Zimmetli varlıklar</h3><div class="ik2-rows">'+p.assets.map(a=>'<div class="ik2-row">'+ic("box",18)+'<div class="ik2-who"><div><b>'+esc(a.name)+'</b><small>'+esc(a.serial)+' · '+dlong(a.date)+'</small></div></div><div class="end">'+st(a.state==="Teslim edildi"?"Onaylandı":a.state)+(a.state==="Onay bekliyor"?'<button class="ik2-btn sm ok" data-ik="approve" data-k="asset" data-v="'+esc(p.id+"|"+a.serial)+'">Teslim al</button>':"")+'</div></div>').join("")+'</div></div>';break;
    case "perf":body='<div class="ik2-preview" style="margin-bottom:12px"><div><small>Ödül puanı</small><b>'+p.score.award+'</b></div><div><small>Ceza puanı</small><b>'+p.score.penalty+'</b></div><div><small>Net puan</small><b>'+score+'</b></div><div><small>Sıralama</small><b>'+(active().map(x=>[x.id,x.score.award-x.score.penalty+S.scores.filter(s=>s.person===x.id).reduce((n,s)=>n+s.pts,0)]).sort((a,c)=>c[1]-a[1]).findIndex(x=>x[0]===id)+1)+'.</b></div></div><div class="ik2-card"><h3>Puan kayıtları</h3><div class="ik2-rows">'+(S.scores.filter(s=>s.person===id).map(s=>'<div class="ik2-row">'+chip(s.kind,s.kind==="Ödül"?"#12936A":"#D23F4A")+'<span>'+esc(s.reason)+'</span><div class="end"><b>'+(s.pts>0?"+":"")+s.pts+'</b><small style="color:#6B7489">'+dlong(s.date)+'</small></div></div>').join("")||'<p class="ik2-empty">Bu dönem puan kaydı yok</p>')+'</div></div>';break;
    case "docs":body='<div class="ik2-card"><h3>Özlük belgeleri</h3><div class="ik2-rows">'+p.docs.map(d=>{const n=d.exp?dd(T,d.exp):null;return '<div class="ik2-row">'+ic("file",18)+'<div class="ik2-who"><div><b>'+esc(d.name)+'</b><small>Yüklenme '+dlong(d.date)+(d.exp?" · geçerlilik "+dlong(d.exp):"")+'</small></div></div><div class="end">'+(n===null?chip("Süresiz","#64748B"):n<0?chip("Süresi geçti","#D23F4A"):n<=30?chip(n+" gün kaldı","#C77712"):chip("Geçerli","#12936A"))+'</div></div>';}).join("")+'</div></div>';break;
    case "pay":body='<div class="ik2-card"><h3>Bordro bilgileri</h3>'+facts([["Ücret bandı",esc(p.salaryBand)],["SGK sicil",esc(p.sgk)],["Banka / IBAN",esc(p.bank),true],["Ödeme günü","Her ayın son iş günü"],["Asgari geçim / vergi","Bordro modülünden"]])+'</div><div class="ik2-alert info">'+ic("shield",16)+'<div>Ücret tutarları gizlilik nedeniyle yalnızca bordro yetkisi olan kullanıcılara gösterilir.</div></div>';break;
    default:body='<div class="ik2-card"><h3>Özet</h3>'+facts([["Sicil no",esc(p.sicil)],["Birim",chip(u[1],u[2])],["Unvan",esc(p.title)],["Yönetici",esc(mgr?.name||"Genel Müdür")],["İşe giriş",dlong(p.start)],["Kıdem",yearsBetween(p.start)+" yıl"],["Sözleşme",esc(p.contract)],["Çalışma modeli",esc(p.model)],["E-posta",esc(p.email)],["GSM",esc(p.gsm)]].concat(p.probationEnd?[["Deneme süresi bitişi",dlong(p.probationEnd)]]:[]).concat(p.status==="Pasif"?[["Çıkış",dlong(p.exitDate)+" · "+esc(p.exitReason)]]:[]))+'</div>'+
      '<div class="ik2-card"><h3>Ekip arkadaşları</h3><div style="display:flex;gap:8px;flex-wrap:wrap">'+active().filter(x=>x.unit===p.unit&&x.id!==id).map(x=>'<button class="ik2-btn sm" data-ik="person" data-v="'+x.id+'">'+av(x.name,"sm")+esc(x.name)+'</button>').join("")+'</div></div>';
  }
  return '<div class="ik2-shade" data-ik="close"></div><aside class="ik2-drawer" role="dialog" aria-modal="true" aria-label="'+esc(p.name)+' personel dosyası">'+
    '<div class="ik2-hero">'+av(p.name,"lg")+'<div style="min-width:0"><h2>'+esc(p.name)+'</h2><p>'+esc(p.title)+' · '+esc(u[1])+' · '+esc(p.sicil)+'</p><div class="chips">'+st(onLeave(id)?"İzinde":p.status)+chip(p.contract,"#4F46E5")+chip(p.model,"#0D9488")+'</div></div><button class="ik2-x" data-ik="close" aria-label="Kapat">'+ic("close",18)+'</button></div>'+
    '<div class="ik2-stats"><div><small>Kıdem</small><b>'+yearsBetween(p.start)+' yıl</b></div><div><small>Kalan izin</small><b>'+b.left+' gün</b></div><div><small>Yaş</small><b>'+yearsBetween(p.birth)+'</b></div><div><small>Net puan</small><b>'+score+'</b></div></div>'+
    '<nav class="ik2-tabs">'+tabs.map(([k,l])=>'<button data-ik="ptab" data-v="'+k+'" class="'+(tab===k?"on":"")+'">'+l+'</button>').join("")+'</nav>'+
    '<div class="ik2-dbody">'+body+'</div><footer class="ik2-dfoot"><small>Son güncelleme: bugün</small><button class="ik2-btn" data-ik="new-leave" data-v="'+id+'">'+ic("calendar",15)+'İzin talebi aç</button><button class="ik2-btn primary" data-ik="edit-person" data-v="'+id+'">'+ic("edit",15)+'Düzenle</button></footer></aside>';
}

function updateLeavePreview(form){
  const v=Object.fromEntries(new FormData(form)),t=lt(v.type),p=P(v.person);
  form.querySelector('[data-show="degree"]').hidden=!t.degree;
  form.querySelector("[data-typehint]").textContent=t.name+": "+t.rule+" · "+(t.paid?"ücretli":"ücretsiz")+" · dayanak "+t.law+(t.doc?" · belge gerekli":"");
  if(t.fixed&&t.fixed<10&&v.start){let end=v.start,n=1;while(n<t.fixed){end=shift(end,1);if(!isWe(end)&&!isHol(end))n++;}if(form.end.dataset.auto!=="off"){form.end.value=end;}}
  if(t.id==="maternity"&&v.start){form.end.value=shift(v.start,111);}
  const s=form.start.value,en=form.end.value;
  const days=t.calendar?(en>=s?dd(s,en)+1:0):workDays(s,en,!!v.half),cal=en>=s?dd(s,en)+1:0,hol=en>=s?HOL.filter(h=>h[0]>=s&&h[0]<=en&&!h[2]&&!isWe(h[0])).length:0;
  const b=p?balance(p):null;
  form.querySelector("[data-preview]").innerHTML=[["İzin süresi",days+" gün"],["Takvim günü",cal+" gün"],["Düşülen tatil",hol+" gün"],["İşe dönüş",en?dshort(nextWork(en)):"—"]].map(([k,x])=>'<div><small>'+k+'</small><b>'+x+'</b></div>').join("");
  const warns=[];
  if(en<s)warns.push(["bad","Bitiş tarihi başlangıçtan önce olamaz."]);
  if(t.balance&&b&&days>b.left)warns.push(["bad","Yetersiz bakiye: kalan "+b.left+" gün, talep "+days+" gün. Ücretsiz izin olarak açabilirsin."]);
  else if(t.balance&&b)warns.push(["info","Bu talepten sonra kalan yıllık izin: "+(b.left-days)+" gün (onay bekleyen "+b.pending+" gün hariç)."]);
  if(t.max&&days>t.max)warns.push(["bad",t.name+" en fazla "+t.max+" gün olabilir."]);
  if(p&&s){const clash=S.leaves.filter(l=>l.person!==p.id&&["Onaylandı","Onay bekliyor"].includes(l.status)&&P(l.person)?.unit===p.unit&&l.start<=en&&l.end>=s);if(clash.length)warns.push(["warn","Aynı birimden "+clash.map(l=>pname(l.person)).join(", ")+" bu tarihlerde izinde."]);}
  if(s&&s<T)warns.push(["warn","Geçmiş tarihli talep: yönetici onayında gerekçe istenir."]);
  form.querySelector("[data-warn]").innerHTML=warns.map(([k,m])=>'<div class="ik2-alert '+k+'">'+ic("alert",16)+'<div>'+esc(m)+'</div></div>').join("");
  return {days,ok:!warns.some(w=>w[0]==="bad")};
}

function decide(k,id,ok,reason){
  if(k==="leave"){
    const l=S.leaves.find(x=>x.id===id);if(!l||l.status!=="Onay bekliyor")return;
    const i=l.steps.findIndex(s=>s.state==="now"||s.state==="wait");if(i<0)return;
    const step=l.steps[i];step.state=ok?"done":"no";step.date=T;step.who=step.who||"Deniz Kaya";if(reason)step.note=reason;
    if(!ok){l.status="Reddedildi";l.steps.forEach(s=>{if(s.state==="wait")s.state="skip";});}
    else if(l.steps[i+1]){l.steps[i+1].state="now";}
    else l.status="Onaylandı";
    save(ok?(l.status==="Onaylandı"?"İzin onaylandı, bakiyeden düşüldü.":step.name+" onayı verildi, sıradaki adıma geçti."):"İzin talebi reddedildi.");
  }else if(k==="overtime"||k==="expense"){
    const x=S[k==="overtime"?"overtime":"expenses"].find(y=>y.id===id);if(!x)return;x.status=ok?"Onaylandı":"Reddedildi";if(reason)x.reason2=reason;save(ok?"Talep onaylandı.":"Talep reddedildi.");
  }else if(k==="asset"){
    const [pid,serial]=id.split("|"),a=P(pid)?.assets.find(z=>z.serial===serial);if(a){a.state=ok?"Teslim edildi":"Reddedildi";save(ok?"Zimmet teslim alındı.":"Zimmet reddedildi.");}
  }
}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-ik]");if(!t||!t.closest(".ik2,#ik2-layer"))return;
  const a=t.dataset.ik,v=t.dataset.v||"";
  if(t.tagName==="SPAN"&&a==="leave")ev.stopPropagation();
  switch(a){
    case "go":location.hash="#ik2?s="+v;break;
    case "close":closeLayer();break;
    case "person":openLayer(personDrawer(v,t.dataset.tab||"general"),{type:"person",id:v,tab:t.dataset.tab||"general"});break;
    case "ptab":IK.layer.tab=v;openLayer(personDrawer(IK.layer.id,v),IK.layer);break;
    case "leave":openLayer(leaveDrawer(v),{type:"leave",id:v});break;
    case "new-leave":openLayer(leaveForm(v),{type:"form"});break;
    case "new-person":openLayer(personForm(""),{type:"form"});break;
    case "edit-person":openLayer(personForm(v),{type:"form"});break;
    case "new-overtime":openLayer(overtimeForm(),{type:"form"});break;
    case "new-expense":openLayer(expenseForm(v),{type:"form"});break;
    case "new-score":openLayer(scoreForm(),{type:"form"});break;
    case "approve":decide(t.dataset.k,v,true);refresh();break;
    case "approve-all":pendingAll().filter(([k])=>!IK.xkind||k===IK.xkind).forEach(([k,x])=>{if(k==="leave"){while(S.leaves.find(l=>l.id===x.id).status==="Onay bekliyor")decide(k,x.id,true);}else decide(k,x.id,true);});save("Görünen tüm talepler onaylandı.");refresh();break;
    case "reject":openLayer(rejectForm(t.dataset.k,v),{type:"form"});break;
    case "cancel-leave":{const l=S.leaves.find(x=>x.id===v);l.status="İptal";l.steps.forEach(s=>{if(s.state!=="done")s.state="skip";});save("İzin talebi iptal edildi.");refresh();break;}
    case "pay":{const x=S.expenses.find(y=>y.id===v);x.status="Ödendi";save("Ödeme kaydedildi.");refresh();break;}
    case "advance-cand":{const c=S.candidates.find(y=>y.id===v),order=["Başvuru","Ön eleme","Mülakat","Teklif","İşe alındı"];c.stage=order[Math.min(4,order.indexOf(c.stage)+1)];if(c.stage==="Mülakat"&&!c.interview)c.interview=D(3);save(c.name+" → "+c.stage);refresh();break;}
    case "punit":IK.unit=v;refresh();break;
    case "pstatus":IK.pstatus=v;refresh();break;
    case "pview":IK.pview=v;refresh();break;
    case "lview":IK.lview=v;refresh();break;
    case "lstat":IK.lstat=v;refresh();break;
    case "apv":IK.apv=v;refresh();break;
    case "xkind":IK.xkind=v;refresh();break;
    case "cal":{if(v==="0")IK.calMonth=T.slice(0,7);else{const [y,m]=IK.calMonth.split("-").map(Number);const d=new Date(y,m-1+Number(v),1);IK.calMonth=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}refresh();break;}
    case "export-people":exportPeople();break;
    case "reset":try{localStorage.removeItem(KEY);}catch{}S=seedData();save("Örnek veriler sıfırlandı.");refresh();break;
  }
});

  '<div class="ik2-cols">'+g.map(([name,f,c])=>{const l=mine.filter(f);return '<section class="c6"><div class="ik2-panel"><header><h2 style="color:'+c+'">'+name+'</h2><small>'+l.length+' iş</small></header><div class="w2-day">'+(l.map(t=>'<div class="w2-task" data-w="open" data-v="'+t.id+'"><button class="done" data-w="complete" data-v="'+t.id+'" title="Tamamlandı olarak işaretle">'+ic("check",13)+'</button><div class="ik2-who" style="min-width:0"><div><b>'+esc(t.title)+'</b><small>'+esc(t.code+" · "+prj(t.project).name)+'</small></div></div><div class="meta">'+prFlag(t)+dueChip(t)+'<button class="w2-timer '+(S.timer?.id===t.id?"run":"")+'" data-w="timer" data-v="'+t.id+'">'+ic("clock",12)+(S.timer?.id===t.id?"Durdur":"Başlat")+'</button></div></div>').join("")||'<p class="ik2-empty">Bu grupta iş yok</p>')+'</div></div></section>';}).join("")+'</div>';

/* ─── Takvim ─── */
function secCalendar(){

    '<div class="w2-month">'+["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"].map(d=>'<div class="wd">'+d+'</div>').join("")+days.map(d=>{const ts=list.filter(t=>t.due===d);return '<div class="d '+(d.slice(0,7)!==V.month?"out ":"")+(isWe(d)?"we ":"")+(d===T?"today":"")+'"><span>'+Number(d.slice(8))+'</span>'+ts.slice(0,3).map(t=>'<button class="w2-ev" style="--t:'+stOf(t.status).color+'" data-w="open" data-v="'+t.id+'" title="'+esc(t.code+" "+t.title)+'">'+esc(t.title)+'</button>').join("")+(ts.length>3?'<button class="w2-more" data-w="day" data-v="'+d+'">+'+(ts.length-3)+' iş daha</button>':"")+'</div>';}).join("")+'</div>';

/* ─── Zaman çizelgesi ─── */
function secTimeline(){
  const days=Array.from({length:42},(_,i)=>shift(V.gStart,i)),cw=34,last=days[days.length-1];
  const list=filtered().filter(t=>t.due>=V.gStart&&t.start<=last);
  const rows=PROJECTS.filter(p=>list.some(t=>t.project===p.id)).map(p=>{
    const ts=list.filter(t=>t.project===p.id).sort((a,b)=>a.start.localeCompare(b.start));
    return '<tr class="proj"><td class="name" style="background:#F7F8FC">'+chip(p.name,p.color)+'</td><td colspan="'+days.length+'"></td></tr>'+ts.map(t=>{
      const s=Math.max(0,dd(V.gStart,t.start)),e=Math.min(days.length-1,dd(V.gStart,t.due)),pct=t.subs.length?subPct(t):t.status==="done"?100:t.status==="todo"?0:50;
      return '<tr><td class="name"><div class="ik2-who">'+av(t.owner,"sm")+'<div><b style="font-size:12.5px">'+esc(t.title)+'</b><small>'+esc(t.code)+' · '+stOf(t.status).name+'</small></div></div></td><td class="track" colspan="'+days.length+'" style="height:38px">'+
        (dd(V.gStart,T)>=0&&dd(V.gStart,T)<days.length?'<span class="todayline" style="left:'+(dd(V.gStart,T)*cw+cw/2)+'px"></span>':"")+
        '<span class="bar" data-w="open" data-v="'+t.id+'" style="--t:'+(isLate(t)?"#D23F4A":p.color)+';left:'+(s*cw+2)+'px;width:'+Math.max(cw-4,(e-s+1)*cw-4)+'px"><i style="width:'+pct+'%"></i><span>'+pct+'%</span></span></td></tr>';
    }).join("");
  }).join("");
  return filters(false)+'<div class="ik2-tools"><button class="ik2-btn sm" data-w="gshift" data-v="-7">'+ic("left",14)+'1 hafta</button><button class="ik2-btn sm" data-w="gshift" data-v="0">Bugün</button><button class="ik2-btn sm" data-w="gshift" data-v="7">1 hafta'+ic("right",14)+'</button><span class="ik2-spacer"></span><small style="color:#6B7489">Kırmızı çubuk gecikmiş iş · çubuk içindeki açık alan ilerleme</small></div>'+
    '<div class="w2-gantt"><table><thead><tr><th class="name">İş</th>'+days.map(d=>'<th class="'+(isWe(d)?"we":"")+'" style="'+(d===T?"color:#D23F4A":"")+'">'+Number(d.slice(8))+'<br><small>'+new Intl.DateTimeFormat("tr-TR",{weekday:"narrow"}).format(asDate(d))+'</small></th>').join("")+'</tr></thead><tbody>'+(rows||'<tr><td class="name">Bu aralıkta iş yok</td></tr>')+'</tbody></table></div>';
}

/* ─── İş yükü ─── */
function secLoad(){
  const days=Array.from({length:10},(_,i)=>i).map(i=>{let d=T;let n=0;while(n<=i){d=shift(d,1);if(!isWe(d))n++;}return d;});
  const open=S.tasks.filter(isOpen);
  const perDay=(m,d)=>open.filter(t=>t.owner===m&&t.start<=d&&t.due>=d).reduce((n,t)=>{const span=Math.max(1,dd(t.start,t.due)+1);return n+Math.max(0,(t.est-t.spent))/60/span;},0);
  const color=h=>h>8?"#FDEDEE":h>6?"#FFF4E2":h>0?"#E7F6EF":"#F4F5F9",tc=h=>h>8?"#D23F4A":h>6?"#B56A0B":h>0?"#12936A":"#94A3B8";
  return '<div class="ik2-tablewrap w2-load"><table class="ik2-table"><thead><tr><th>Kişi</th><th class="num">Açık iş</th><th class="num">Kalan tahmini</th>'+days.map(d=>'<th style="text-align:center">'+new Intl.DateTimeFormat("tr-TR",{weekday:"short",day:"numeric"}).format(asDate(d))+'</th>').join("")+'</tr></thead><tbody>'+
    MEMBERS.map(m=>{const mine=open.filter(t=>t.owner===m),rem=mine.reduce((n,t)=>n+Math.max(0,t.est-t.spent),0);return '<tr><td><div class="ik2-who">'+av(m)+'<div><b>'+esc(m)+'</b><small>Günlük kapasite 8 saat</small></div></div></td><td class="num">'+mine.length+'</td><td class="num">'+hm(rem)+'</td>'+days.map(d=>{const h=perDay(m,d);return '<td class="cell"><div class="w2-heat" style="background:'+color(h)+';color:'+tc(h)+'">'+(h?h.toFixed(1):"—")+'</div></td>';}).join("")+'</tr>';}).join("")+'</tbody></table></div>'+
    '<div class="ik2-legendrow"><span><i style="--t:#E7F6EF"></i>Uygun (≤ 6 sa)</span><span><i style="--t:#FFF4E2"></i>Yoğun (6–8 sa)</span><span><i style="--t:#FDEDEE"></i>Aşırı yük (> 8 sa)</span><span>Kalan tahmini süre, işin başlangıç–teslim aralığına eşit dağıtılır.</span></div>';
}

/* ─── Raporlar ─── */
function secReports(){

  const maxW=Math.max(...weeks.flatMap(w=>[w[1],w[2]]),1);
  const byType=TYPES.map(t=>[t,S.tasks.filter(x=>x.type===t.id).length]),maxT=Math.max(...byType.map(x=>x[1]),1);
  const sla=PRIOS.map(p=>{const d=S.tasks.filter(t=>t.prio===p.id&&t.done);const ok=d.filter(t=>dd(t.created.slice(0,10),t.done)<=p.sla*2).length;return [p,d.length,d.length?Math.round(ok/d.length*100):null];});
  const est=S.tasks.filter(t=>t.done).reduce((n,t)=>n+t.est,0),spent=S.tasks.filter(t=>t.done).reduce((n,t)=>n+t.spent,0);
  return '<div class="ik2-kpis">'+kpi("Tamamlanan iş",S.tasks.filter(t=>t.done).length,"Tüm zamanlar","#12936A")+kpi("Tahmin doğruluğu","%"+Math.round(spent/Math.max(1,est)*100),"Harcanan / tahmini süre","#4F46E5")+kpi("Toplam kaydedilen süre",hm(S.tasks.reduce((n,t)=>n+t.spent,0)),"Zaman kayıtları","#0EA5E9")+kpi("Açık arıza",S.tasks.filter(t=>t.type==="bug"&&isOpen(t)).length,"Hata kayıtları","#D23F4A")+'</div>'+
  '<div class="ik2-cols"><section class="ik2-panel c7"><header><h2>Haftalık açılan / tamamlanan</h2><small>Son 8 hafta</small></header><div class="ik2-cols-chart" style="height:170px">'+weeks.map(([l,d,c])=>'<div><b>'+d+'</b><span style="display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center"><i style="height:'+Math.max(3,c/maxW*100)+'%;background:#CBD5E1;max-width:14px"></i><i style="height:'+Math.max(3,d/maxW*100)+'%;max-width:14px;background:linear-gradient(180deg,#34D399,#12936A)"></i></span><small>'+l+'</small></div>').join("")+'</div><div class="ik2-legendrow"><span><i style="--t:#CBD5E1"></i>Açılan</span><span><i style="--t:#12936A"></i>Tamamlanan</span></div></section>'+
  '<section class="ik2-panel c5"><header><h2>İş türüne göre</h2></header><div class="ik2-bars">'+byType.map(([t,n])=>'<div class="ik2-bar"><span>'+esc(t.name)+'</span><div class="ik2-meter"><i style="width:'+(n/maxT*100)+'%"></i></div><b>'+n+'</b></div>').join("")+'</div></section>'+
  '<section class="ik2-panel c12"><header><h2>Önceliğe göre SLA uyumu</h2><small>Hedef çözüm süresi içinde kapanan işler</small></header><div class="ik2-tablewrap" style="border:0"><table class="ik2-table"><thead><tr><th>Öncelik</th><th>Hedef süre</th><th class="num">Tamamlanan</th><th>Uyum</th></tr></thead><tbody>'+sla.map(([p,n,pc])=>'<tr><td>'+chip(p.name,p.color)+'</td><td>'+p.sla+' iş günü</td><td class="num">'+n+'</td><td style="min-width:220px">'+(pc===null?'<small style="color:#94A3B8">Veri yok</small>':'<div style="display:flex;align-items:center;gap:10px"><div class="ik2-meter" style="flex:1;--t:'+(pc>=80?"#12936A":pc>=60?"#D97706":"#D23F4A")+'"><i style="width:'+pc+'%"></i></div><b>%'+pc+'</b></div>')+'</td></tr>').join("")+'</tbody></table></div></section></div>';
}

/* ═════════ Detay çekmecesi ═════════ */
